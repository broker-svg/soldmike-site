<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leads | SoldMike</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D2870">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leads">
<link rel="apple-touch-icon" href="/open-house/icon-192.png">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Leads (host PIN): every website lead with source, activity and saved searches. Same look as the open house app. */
:root{--navy:#1D2870;--ink:#141833;--red:#D7141E;--mist:#F7F8FB;--line:#DCE0EC;--muted:#545B78;--pale:#C9D0F2;--green:#1B7A3E;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
a{color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600;font-size:18px;cursor:pointer;text-decoration:none}
.btn.navy{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -30px rgba(20,24,51,.45)}
.muted{color:var(--muted)}
.err{color:var(--red);font-weight:600;margin:0}
.bar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.bar>:last-child{justify-self:end}
.bar img{height:46px;width:auto;display:block}
.bar b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.bar a.lnk,.bar button{background:none;border:1px solid #4A5592;color:#fff;border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;text-decoration:none}
.page{padding-top:20px;padding-bottom:60px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:40px;flex:1}
.search{width:100%;min-height:56px;border:1px solid var(--line);border-radius:10px;padding:0 16px;background:#fff;font-size:19px}
.list{display:flex;flex-direction:column;gap:10px}
.lead{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 16px;text-align:left;width:100%;cursor:pointer;color:inherit;border:1px solid var(--line);border-radius:14px;background:#fff}
.lead:hover{border-color:var(--navy)}
.lead b{font-size:20px}
.lead .src{color:var(--muted);font-size:15px}
.lead .when{color:var(--muted);font-size:15px;text-align:right;white-space:nowrap}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:14px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--mist);border:1px solid var(--line)}
.chip.on{background:#E7F4EC;border-color:#B9DEC6;color:var(--green)}
.chip.off{background:#FDECEC;border-color:#F3C2C4;color:var(--red)}
.det{padding:20px;display:flex;flex-direction:column;gap:16px}
.det h2{font-size:34px}
.contact{display:flex;flex-wrap:wrap;gap:10px}
.contact .btn{flex:1 1 200px}
.sec h3{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 8px}
.ss{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ss small{display:block;color:var(--muted);font-size:14px}
.tog{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;flex:none}
.tog[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.ev{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.ev .k{font-weight:600}
.ev .t{color:var(--muted);font-size:14px}
@media (max-width:560px){.ev{grid-template-columns:1fr}.top h1{font-size:34px}}
dialog{border:0;border-radius:16px;padding:22px;width:min(380px,calc(100vw - 32px));box-shadow:0 30px 60px rgba(10,14,40,.4)}
dialog::backdrop{background:rgba(20,24,51,.6)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog input{min-height:56px;border:1px solid var(--line);border-radius:10px;padding:0 16px;font-size:19px}
</style>
</head>
<body>
<div id="app"><p class="wrap muted" style="padding-top:30px">Loading…</p></div>
<dialog id="pinDlg"><form method="dialog" id="pinForm"><h2 style="font-size:28px">Host only</h2><label for="pinIn">Enter your PIN</label><input id="pinIn" inputmode="numeric" autocomplete="off" type="password"><p class="err" id="pinErr" hidden>Wrong PIN</p><button class="btn" type="submit">Continue</button></form></dialog>
<script src="/assets/listings.js?v=3"></script>
<script>
(function(){
  var SM=window.SM, esc=SM.esc, app=document.getElementById('app'), LOGO='/logo-soldmike-white.png';
  var KIND={view:'Viewed',save:'Saved',inquiry:'Inquiry',openhouse:'Open house',search:'Saved search',alert:'Alert sent',form:'Form',unsubscribe:'Stopped emails'};
  function pin(){return SM.store('sm_oh_pin')||'';}
  function api(path,opt){opt=opt||{};opt.headers=Object.assign({'X-OH-Pin':pin(),'Content-Type':'application/json'},opt.headers||{});
    return fetch(SM.api+path,opt).then(function(r){if(r.status===401)throw 'pin';if(!r.ok)throw r.status;return r.json();});}
  function askPin(){return new Promise(function(res){var d=document.getElementById('pinDlg'),i=document.getElementById('pinIn'),e=document.getElementById('pinErr');
    document.getElementById('pinForm').onsubmit=function(ev){ev.preventDefault();SM.store('sm_oh_pin',i.value.trim());api('/api/oh/check',{method:'POST'}).then(function(){d.close();res();}).catch(function(){e.hidden=false;});};
    d.showModal();i.focus();});}
  function guard(p){return p.catch(function(e){if(e==='pin')return askPin().then(route);app.innerHTML='<p class="wrap err" style="padding-top:30px">Could not load. Check the connection and refresh.</p>';throw e;});}
  function ago(iso){if(!iso)return '';var s=(Date.now()-Date.parse(iso))/1000;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';if(s<86400*14)return Math.round(s/86400)+' days ago';return new Date(iso).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});}
  function name(l){return ((l.first||'')+' '+(l.last||'')).trim()||l.email||l.phone||'No name';}
  function bar(title,right){return '<div class="bar"><a href="/" aria-label="SoldMike home"><img src="'+LOGO+'" alt="SoldMike"></a><b>'+title+'</b>'+(right||'<span></span>')+'</div>';}

  function list(){
    app.innerHTML=bar('Leads','<a class="lnk" href="/admin/">Back office</a>')+'<div class="wrap page"><div class="top"><h1>Website leads</h1><span class="muted" id="tot"></span></div>'
      +'<input class="search" id="q" type="search" placeholder="Search name, email, phone or source" autocomplete="off"><div class="list" id="ll"><p class="muted">Loading…</p></div>'
      +'<p class="muted" style="font-size:14px">Every lead from the website: open house sign-ins, forms, Mika, listing questions. The homes they view and save are listed on each lead. Follow Up Boss stays your CRM; tap a lead to open it there.</p></div>';
    var t;document.getElementById('q').addEventListener('input',function(){clearTimeout(t);var v=this.value;t=setTimeout(function(){load(v);},300);});
    load('');
  }
  function load(q){
    guard(api('/api/leads/list'+(q?'?q='+encodeURIComponent(q):''))).then(function(j){
      document.getElementById('tot').textContent=j.total+' total';
      var el=document.getElementById('ll');
      if(!j.items.length){el.innerHTML='<div class="card muted" style="padding:24px;text-align:center">'+(q?'No leads match that search.':'No leads yet. Sign-ins and website forms will show up here.')+'</div>';return;}
      el.innerHTML=j.items.map(function(l){
        var c=[];if(l.views)c.push('<span class="chip">'+l.views+' viewed</span>');if(l.saves)c.push('<span class="chip">'+l.saves+' saved</span>');if(l.inquiries)c.push('<span class="chip">'+l.inquiries+' inquir'+(l.inquiries>1?'ies':'y')+'</span>');
        if(l.searches)c.push('<span class="chip on">'+l.searches+' saved search'+(l.searches>1?'es':'')+'</span>');if(l.unsub)c.push('<span class="chip off">Emails off</span>');
        return '<button class="lead" type="button" data-id="'+l.id+'"><b>'+esc(name(l))+'</b><span class="when">'+esc(ago(l.seen))+'</span><span class="src">'+esc(l.source||'')+'</span><span class="when">'+esc(l.email||l.phone||'')+'</span>'+(c.length?'<span class="chips">'+c.join('')+'</span>':'')+'</button>';
      }).join('');
      [].forEach.call(el.querySelectorAll('.lead'),function(b){b.onclick=function(){location.hash='#'+b.dataset.id;};});
    });
  }
  function detail(id){
    app.innerHTML=bar('Lead','<button type="button" id="back">Back</button>')+'<div class="wrap page"><div class="card det" id="dd"><p class="muted">Loading…</p></div></div>';
    document.getElementById('back').onclick=function(){location.hash='';};
    guard(api('/api/leads/get?id='+encodeURIComponent(id))).then(function(j){
      var l=j.lead, fub=l.fub?j.fubApp+'/2/people/view/'+l.fub:'';
      var h='<div><h2>'+esc(name(l))+'</h2><p class="muted" style="margin:6px 0 0">'+esc(l.source||'')+' · first seen '+esc(ago(l.created))+' · last active '+esc(ago(l.seen))+'</p></div>'
        +'<div class="contact">'+(fub?'<a class="btn navy" href="'+esc(fub)+'" target="_blank" rel="noopener">Open in Follow Up Boss</a>':'<span class="muted">Not found in Follow Up Boss yet</span>')
        +(l.phone?'<a class="btn ghost" href="tel:'+esc(l.phone)+'">Call '+esc(l.phone)+'</a>':'')+(l.email?'<a class="btn ghost" href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>':'')+'</div>'
        +'<p class="muted" style="margin:0;font-size:15px">New-listing emails: '+(l.unsub?'<b style="color:var(--red)">stopped by the lead</b>':l.consent?'<b style="color:var(--green)">yes, they asked for them</b>':'no consent given')+'</p>';
      h+='<div class="sec"><h3>Saved searches</h3>'+(j.searches.length?j.searches.map(function(s){
        return '<div class="ss"><div><b>'+esc(s.label)+'</b><small>'+s.matched+' new home'+(s.matched===1?'':'s')+' matched'+(s.sent?' · last alert '+esc(ago(s.sent)):'')+' · made '+esc(ago(s.created))+'</small></div><button class="tog" type="button" data-s="'+s.id+'" aria-pressed="'+(s.active?'true':'false')+'">'+(s.active?'On':'Off')+'</button></div>';
      }).join(''):'<p class="muted" style="margin:0">None yet.</p>')+'</div>';
      h+='<div class="sec"><h3>Activity</h3>'+(j.events.length?j.events.map(function(e){
        var what=e.home?(e.ref?'<a href="/listings/home/?id='+encodeURIComponent(e.ref)+'" target="_blank" rel="noopener">'+esc(e.home)+'</a>':esc(e.home))+(e.price?' · '+SM.money(e.price)+(e.lease?'/mo':''):''):'';
        return '<div class="ev"><div><div class="k">'+esc(KIND[e.kind]||e.kind)+'</div><div class="t">'+esc(ago(e.at))+'</div></div><div>'+[what,esc(e.note||'')].filter(Boolean).join('<br>')+'</div></div>';
      }).join(''):'<p class="muted" style="margin:0">No activity yet.</p>')+'</div>';
      h+='<div style="border-top:1px solid var(--line);padding-top:14px"><button class="tog" type="button" id="rm" style="color:var(--red)">Remove from this list</button><p class="muted" style="font-size:14px;margin:6px 0 0">Removes this lead from the website list only. Nothing changes in Follow Up Boss.</p></div>';
      document.getElementById('dd').innerHTML=h;
      document.getElementById('rm').onclick=function(){if(!confirm('Remove '+name(l)+' from the website lead list? Follow Up Boss is not affected.'))return;
        api('/api/leads/remove',{method:'POST',body:JSON.stringify({id:l.id})}).then(function(){location.hash='';});};
      [].forEach.call(document.querySelectorAll('.tog'),function(b){b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';
        api('/api/leads/search',{method:'POST',body:JSON.stringify({id:+b.dataset.s,active:on})}).then(function(){b.setAttribute('aria-pressed',on);b.textContent=on?'On':'Off';});};});
    });
  }
  function route(){var id=location.hash.slice(1);if(/^\d+$/.test(id))detail(id);else list();}
  addEventListener('hashchange',route);
  if(!pin())askPin().then(route);else route();
})();
</script>
</body>
</html>
