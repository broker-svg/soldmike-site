<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks | SoldMike</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="apple-touch-icon" href="/open-house/icon-192.png">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Tasks: one list of everything to do today (FUB tasks, HQ to-dos, Google Tasks, iPhone Reminders). Phone first, almost no chrome. */
:root{--navy:#1D2870;--ink:#141833;--red:#D7141E;--line:#E4E7F0;--muted:#5F6680;--green:#1B7A3E;--bg:#fff;--soft:#F5F6FA;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(6px + env(safe-area-inset-top,0px)) 14px 0;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.row1 b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--navy);letter-spacing:.06em;text-transform:uppercase}
.row1 nav{margin-left:auto;display:flex;gap:10px}
.row1 nav a{color:var(--muted);text-decoration:none;font-weight:600}
.row1 button{background:none;border:0;padding:2px 4px;color:var(--muted);cursor:pointer;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #C9CEDD;background:var(--bg);font-weight:600;font-size:17px;cursor:pointer;color:var(--ink)}
.chips button b{margin-left:4px}
.chips button[aria-pressed="true"]{border-style:solid;background:var(--ink);border-color:var(--ink);color:#fff}
.chips button.late b{color:var(--red)}.chips button.late[aria-pressed="true"]{background:var(--red);border-color:var(--red)}.chips button.late[aria-pressed="true"] b{color:#fff}.chips button.late.off{border-style:dashed;color:var(--muted)}
.chips .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.chips .src{border-style:solid;border-color:var(--line);color:var(--muted)}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom,0px))}
.grp{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 2px}
.grp.late{color:var(--red)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ck{appearance:none;-webkit-appearance:none;width:32px;height:32px;border:2px solid #AAB1CC;border-radius:9px;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:#fff;flex:none}
.ck:checked{background:var(--green);border-color:var(--green)}
.ck:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.t{flex:1;min-width:0}
.t .nm{font-weight:600;font-size:21px;overflow-wrap:anywhere}
.t small{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:4px;font-size:16px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.lt{color:var(--red);font-weight:600}
li.done .nm{text-decoration:line-through;opacity:.45}
.call{flex:none;align-self:center;min-width:44px;min-height:44px;border-radius:22px;border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--green);font-size:20px}
.empty{color:var(--muted);text-align:center;padding:48px 10px;font-size:17px}
.empty b{display:block;font-family:var(--display);font-size:28px;color:var(--ink);margin-bottom:4px}
.note{font-size:13px;color:var(--muted);padding:10px 0}
.add{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:46px;border:1px solid #C9CEDD;border-radius:12px;padding:0 14px;font-size:17px;background:#fff}
.add button{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:calc(100vw - 28px)}
dialog{border:0;border-radius:16px;padding:20px;width:min(380px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,24,51,.55)}
dialog h2{font-family:var(--display);margin:0 0 10px;text-transform:uppercase}
dialog input{width:100%;min-height:46px;border:1px solid #C9CEDD;border-radius:10px;padding:0 12px;font-size:18px}
dialog button{margin-top:12px;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600}
.err{color:var(--red);font-weight:600;margin:8px 0 0}
@media (min-width:700px){main,.top>div{max-width:680px;margin-left:auto;margin-right:auto}.add{justify-content:center}.add input{max-width:560px}}
</style>
</head>
<body>
<header class="top"><div>
  <div class="row1"><b>Tasks</b><span id="now"></span>
    <nav aria-label="Dashboards"><a href="/hq/">HQ</a><a href="/hq/agents/#sellers">Sellers</a><a href="/hq/agents/#buyers">Buyers</a></nav>
    <button type="button" id="ref" aria-label="Refresh">↻</button></div>
  <div class="chips" id="chips"></div>
</div></header>
<main id="list"><p class="empty">Loading…</p></main>
<form class="add" id="add"><input id="addIn" type="text" placeholder="Add a to-do for today" aria-label="New to-do" autocomplete="off"><button type="submit">Add</button></form>
<dialog id="pinDlg"><form method="dialog" id="pinForm"><h2>Host only</h2><input id="pinIn" inputmode="numeric" type="password" autocomplete="off" aria-label="PIN" placeholder="PIN"><p class="err" id="pinErr" hidden>Wrong PIN</p><button type="submit">Continue</button></form></dialog>
<script>
(function(){
'use strict';
var API=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8787':'https://soldmike-listings.broker-e2c.workers.dev';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'X-OH-Pin':store('sm_oh_pin')||'','Content-Type':'application/json'},opt.headers||{});
  return fetch(API+'/api/hq/'+path,opt).then(function(r){if(r.status===401)throw 'pin';return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw j.error||('Error '+r.status);return j;});});}
function post(p,b){return api(p,{method:'POST',body:JSON.stringify(b)});}
function askPin(){return new Promise(function(res){var d=$('pinDlg');$('pinForm').onsubmit=function(e){e.preventDefault();store('sm_oh_pin',$('pinIn').value.trim());api('desk/todos').then(function(){d.close();res();}).catch(function(){$('pinErr').hidden=false;});};if(!d.open)d.showModal();$('pinIn').focus();});}

var SRC={fub:['FUB','#1D2870'],mine:['To-do','#D7141E'],g:['Google','#1B7A3E'],rem:['Reminder','#9A5B00']};
var S={items:[],errs:[],fubApp:'https://app.followupboss.com',scope:store('tk_scope')||'today',hideLate:store('tk_hidelate')!==false,src:store('tk_src')||'all',loading:false};

function dayOf(x){if(!x)return '';var s=String(x);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var t=Date.parse(s);return isNaN(t)?s.slice(0,10):ymd(new Date(t));}
function hasTime(x){return /T\d\d:\d\d/.test(String(x||''))&&!/T00:00(:00)?(\.000)?(Z|[+-]00:?00)?$/.test(String(x));}
function tm(x){var d=new Date(x);return d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'}).replace(':00','').replace(/\s?([ap])\.?m\.?/i,function(m,a){return ' '+a.toUpperCase()+'M';});}

function load(){
  if(S.loading)return;S.loading=true;$('ref').textContent='…';
  var out=[],errs=[];
  var jobs=[
    api('desk/tasks').then(function(j){S.fubApp=j.fubApp||S.fubApp;(j.tasks||[]).forEach(function(t){out.push({src:'fub',id:t.id,title:t.name||t.type,type:t.type,day:dayOf(t.dueDate||t.due),time:hasTime(t.due)?t.due:null,who:t.who,phone:t.phone,person:t.person});});}).catch(function(e){if(e==='pin')throw e;errs.push('Follow Up Boss');}),
    api('desk/todos?today='+ymd(new Date())).then(function(j){(j.items||[]).forEach(function(t){if(!t.done)out.push({src:'mine',id:t.id,title:t.title,day:t.due||''});});}).catch(function(e){if(e==='pin')throw e;errs.push('To-dos');}),
    api('gtasks').then(function(j){(j.items||[]).forEach(function(t){out.push({src:'g',id:t.id,list:t.list,title:t.title,who:t.listName,day:t.due?String(t.due).slice(0,10):''});});}).catch(function(e){if(e==='pin')throw e;errs.push('Google Tasks');}),
    api('reminders').then(function(j){(j.items||[]).forEach(function(t){out.push({src:'rem',id:t.id,title:t.title,who:t.list,day:dayOf(t.due),time:hasTime(t.due)?t.due:null,flag:t.flag});});}).catch(function(e){if(e==='pin')throw e;})
  ];
  Promise.all(jobs).then(function(){S.items=out;S.errs=errs;render();}).catch(function(e){if(e==='pin')return askPin().then(function(){S.loading=false;load();});toast('Could not load. Check the connection.');})
    .then(function(){S.loading=false;$('ref').textContent='↻';});
}

function render(){
  var t=ymd(new Date()),tm1=new Date();tm1.setDate(tm1.getDate()+1);var tom=ymd(tm1);
  var all=S.items.filter(function(x){return S.src==='all'||x.src===S.src;});
  all.forEach(function(x){x.late=!!(x.day&&x.day<t);});
  var nToday=all.filter(function(x){return x.day===t;}).length,nLate=all.filter(function(x){return x.late;}).length;
  // Overdue switch hides overdue tasks in every view; Today = due today; All days = everything by date
  var L=all.filter(function(x){if(S.hideLate&&x.late)return false;if(S.scope==='today')return x.day===t||(!S.hideLate&&x.late);return true;});
  L.sort(function(a,b){var ka=a.day||'9999',kb=b.day||'9999';return ka.localeCompare(kb)||String(a.time||'').localeCompare(String(b.time||''))||String(a.title).localeCompare(String(b.title));});
  var counts={};S.items.forEach(function(x){counts[x.src]=(counts[x.src]||0)+1;});
  $('chips').innerHTML='<button type="button" data-w="today" aria-pressed="'+(S.scope==='today')+'">Today <b>'+nToday+'</b></button><button type="button" data-w="all" aria-pressed="'+(S.scope==='all')+'">All days <b>'+all.length+'</b></button>'
    +'<button type="button" class="late'+(S.hideLate?' off':'')+'" data-w="late" aria-pressed="'+(!S.hideLate)+'">'+(S.hideLate?'Overdue hidden':'Overdue')+' <b>'+nLate+'</b></button><i class="sep"></i>'
    +['all','fub','mine','g','rem'].map(function(k){return '<button type="button" class="src" data-s="'+k+'" aria-pressed="'+(S.src===k)+'">'+(k==='all'?'All sources':SRC[k][0])+(k!=='all'&&counts[k]?' '+counts[k]:'')+'</button>';}).join('');
  if(!L.length){$('list').innerHTML='<div class="empty"><b>'+(S.scope==='today'?'Nothing left today':'All clear')+'</b>'+(nLate&&S.hideLate?nLate+' overdue hidden. Tap Overdue to show them.':'Nice work.')+'</div>'+errNote();return;}
  var groups=[],cur=null;
  L.forEach(function(x){var g=x.late?'Overdue':x.day===t?'Today':x.day===tom?'Tomorrow':x.day?new Date(x.day+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'}):'No date';
    if(!cur||cur.n!==g){cur={n:g,items:[]};groups.push(cur);}cur.items.push(x);});
  $('list').innerHTML=groups.map(function(g){return (groups.length>1||g.n!=='Today'?'<div class="grp'+(g.n==='Overdue'?' late':'')+'">'+esc(g.n)+'</div>':'')+'<ul>'+g.items.map(row).join('')+'</ul>';}).join('')+errNote();
}
function row(x){var bits=['<span><i class="dot" style="background:'+SRC[x.src][1]+'"></i>'+esc(x.src==='fub'&&x.type&&x.type!==x.title?x.type:SRC[x.src][0])+'</span>'];
  if(x.time)bits.push('<span>'+esc(tm(x.time))+'</span>');
  if(x.late)bits.push('<span class="lt">'+esc(new Date(x.day+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'}))+'</span>');
  if(x.who)bits.push(x.src==='fub'&&x.person?'<a href="'+S.fubApp+'/2/people/view/'+x.person+'" target="_blank" rel="noopener" style="color:inherit">'+esc(x.who)+'</a>':'<span>'+esc(x.who)+'</span>');
  if(x.flag)bits.push('<span>⚑</span>');
  var tel=x.phone?String(x.phone).replace(/[^\d+]/g,''):'';
  return '<li data-src="'+x.src+'" data-id="'+esc(x.id)+'"><input class="ck" type="checkbox" aria-label="Done: '+esc(x.title)+'"><div class="t"><div class="nm">'+esc(x.title)+'</div><small>'+bits.join('')+'</small></div>'
    +(tel?'<a class="call" href="tel:'+esc(tel)+'" aria-label="Call '+esc(x.who||'')+'">✆</a>':'')+'</li>';}
function errNote(){return S.errs.length?'<p class="note">Couldn\u2019t reach: '+esc(S.errs.join(', '))+'. Tap ↻ to retry.</p>':'';}

document.addEventListener('change',function(e){var c=e.target;if(!c.classList.contains('ck'))return;var li=c.closest('li'),src=li.dataset.src,id=li.dataset.id;
  var x=S.items.filter(function(y){return y.src===src&&String(y.id)===id;})[0];if(!x)return;li.classList.toggle('done',c.checked);
  var call=src==='fub'?post('task',{id:+id,done:c.checked}):src==='g'?post('gtask',{list:x.list,id:id,done:c.checked}):src==='mine'?post('item/done',{id:+id,done:c.checked}):post('reminder',{id:id,title:x.title,done:c.checked});
  call.then(function(){toast(src==='rem'?'Done. Clears on your iPhone at its next sync.':'Done');if(!c.checked)return;setTimeout(function(){S.items=S.items.filter(function(y){return y!==x;});render();},700);})
    .catch(function(err){c.checked=!c.checked;li.classList.toggle('done',c.checked);toast(err==='pin'?'PIN needed':'Couldn\u2019t save. Try again.');});});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.w){if(b.dataset.w==='late'){S.hideLate=!S.hideLate;store('tk_hidelate',S.hideLate);}else{S.scope=b.dataset.w;store('tk_scope',S.scope);}render();}
  if(b.dataset.s){S.src=b.dataset.s;store('tk_src',S.src);render();}
  if(b.id==='ref')load();});
$('add').onsubmit=function(e){e.preventDefault();var v=$('addIn').value.trim();if(!v)return;
  post('item',{kind:'todo',title:v,due:ymd(new Date())}).then(function(j){S.items.push({src:'mine',id:j.id,title:v,day:ymd(new Date())});$('addIn').value='';render();toast('Added');}).catch(function(){toast('Couldn\u2019t add. Try again.');});};
function clock(){var d=new Date();$('now').textContent=d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})+' · '+tm(d);}
clock();setInterval(clock,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){clock();load();}});
if(!store('sm_oh_pin'))askPin().then(load);else load();
})();
</script>
</body>
</html>
