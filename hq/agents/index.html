<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Desk | SoldMike</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D2870">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk">
<link rel="apple-touch-icon" href="/open-house/icon-192.png">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Agent Desk: Sellers / Buyers / Marketing / Toolkit next to HQ. Same look as /hq/ (light only). */
:root{--navy:#1D2870;--navy2:#26338A;--ink:#141833;--red:#D7141E;--mist:#F7F8FB;--line:#DCE0EC;--muted:#545B78;--pale:#C9D0F2;--green:#1B7A3E;--amber:#9A5B00;--white:#fff;
  --gbg:#E7F4EC;--gln:#B9DEC6;--abg:#FFF4E0;--aln:#F0D6A6;--rbg:#FDECEC;--rln:#F3C1C3;--nbg:#ECEFFB;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
a{color:var(--navy)}
.muted{color:var(--muted)}
.err{color:var(--red);font-weight:600;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--red);color:var(--white);font-weight:600;font-size:17px;cursor:pointer;text-decoration:none}
.btn.navy{background:var(--navy)}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px;border-radius:8px}
.btn.danger{background:var(--white);color:var(--red);border:1px solid var(--rln)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--mist);border:1px solid var(--line);color:var(--muted);white-space:nowrap;text-decoration:none}
.chip.g{background:var(--gbg);border-color:var(--gln);color:var(--green)}
.chip.a{background:var(--abg);border-color:var(--aln);color:var(--amber)}
.chip.r{background:var(--rbg);border-color:var(--rln);color:var(--red)}
.chip.n{background:var(--nbg);border-color:var(--pale);color:var(--navy)}

.bar{background:var(--navy);color:var(--white);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.bar>:last-child{justify-self:end;display:flex;gap:8px}
.bar img{height:42px;width:auto;display:block}
.bar b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.bar button{background:none;border:1px solid #4A5592;color:var(--white);border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.bar button.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.bar{grid-template-columns:auto 1fr}.bar b{display:none}.hide-sm{display:none}}

.tabsbar{position:sticky;top:0;z-index:10;background:var(--navy2);border-top:1px solid #3A4799}
.tabsbar nav{max-width:1440px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.tabsbar nav::-webkit-scrollbar{display:none}
.tabsbar a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:0 16px;color:var(--pale);text-decoration:none;font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.04em;border-bottom:4px solid transparent}
.tabsbar a[aria-current="page"]{color:var(--white);border-bottom-color:var(--red)}
.tabsbar a .n{font-family:var(--body);font-size:12px;font-weight:700;background:var(--red);color:var(--white);border-radius:10px;padding:0 7px;line-height:19px;letter-spacing:0}

.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 80px;display:grid;gap:20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 60px -34px rgba(20,24,51,.4);min-width:0}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd h2{font-size:30px;flex:0 1 auto;min-width:0}
.hd .sub{color:var(--muted);font-size:15px;flex:1 1 180px;min-width:0}
.sec{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.empty{color:var(--muted);font-size:16px;padding:6px 0;margin:0}
.lnkb{background:none;border:0;padding:0;color:var(--navy);font-weight:600;cursor:pointer;font-size:15px;text-decoration:underline}
@media (max-width:640px){.card{padding:16px}.hd h2{font-size:26px}}

.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;font-weight:600;color:var(--muted);user-select:none;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--red);outline-offset:2px}

/* inbox */
.inbox{border:2px dashed var(--pale)}
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.ld{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0;background:var(--mist);align-content:start}
.ld .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ld b{font-weight:600;font-size:18px}
.ld .src{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ld .acts{display:flex;gap:8px;flex-wrap:wrap}
.ld .meta{display:flex;gap:6px;flex-wrap:wrap}
.selsm{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:14px;padding:0 8px}

/* boards */
.stages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 12px;padding:2px 4px}
.stages::-webkit-scrollbar{display:none}
.stages button{flex:none;min-height:38px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--white);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stages button .n{min-width:20px;padding:0 6px;border-radius:10px;background:var(--mist);font-size:12px;line-height:18px;text-align:center}
.stages .arrow{flex:none;align-self:center;color:var(--pale);font-weight:700}
.board{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin:0 -20px;padding-inline:20px;scroll-padding-inline:20px}
@media (max-width:640px){.board{margin:0 -16px;padding-inline:16px;scroll-padding-inline:16px}}
.col{flex:none;width:min(330px,calc(100vw - 64px));scroll-snap-align:start;background:var(--mist);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;align-self:flex-start;border-top:5px solid var(--sc,var(--navy))}
.col h3{font-size:22px;display:flex;align-items:baseline;gap:8px;padding:4px 4px 0}
.col h3 small{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted);text-transform:none}
.col .grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px;margin-top:-6px;min-height:16px}
.col .none{font-size:15px;color:var(--muted);padding:12px 6px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.pc{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.pc .t{display:grid;gap:2px}
.pc .t b{font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.pc .t span{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.pc .meta{display:flex;gap:6px;flex-wrap:wrap}
.pc .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:15px;margin:0}
.pc .kv dt{color:var(--muted)}
.pc .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.pc .note{font-size:15px;overflow-wrap:anywhere;white-space:pre-line}
.due{display:grid;gap:2px}
.due .dh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.due label{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.3;cursor:pointer;padding:4px 0}
.due input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--green)}
.due input:checked+span{color:var(--muted);text-decoration:line-through}
.pacts{display:flex;gap:6px;flex-wrap:wrap}
.pb{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--navy);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pb::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.55;flex:none}
.pb.hot{background:var(--navy);border-color:var(--navy);color:var(--white)}
.morebtn{background:none;border:0;padding:4px 0;color:var(--navy);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;justify-self:start}
.pfoot{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap}
.pfoot select{flex:1;min-width:120px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:14px;padding:0 8px}
.pfoot .lk{font-size:14px;font-weight:600;color:var(--navy);background:none;border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}

/* resources */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.rt{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start;background:var(--white);min-width:0;text-decoration:none;color:var(--ink)}
.rt:hover{border-color:var(--navy)}
.rt .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rt b{font-weight:600}
.rt p{margin:0;font-size:15px;color:var(--muted)}
details.faq{border-top:1px solid var(--line)}
details.faq:last-of-type{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"+";font-family:var(--display);font-weight:800;color:var(--red);width:14px;flex:none}
details.faq[open] summary::before{content:"–"}
details.faq .a{padding:0 0 14px 24px;font-size:16px;max-width:72ch}
details.faq .a p{margin:0 0 8px}

/* marketing */
.mk{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.mk>.card{grid-column:span 6}
.mk>.wide{grid-column:span 12}
@media (max-width:900px){.mk{grid-template-columns:minmax(0,1fr)}.mk>.card,.mk>.wide{grid-column:auto}}
.li{list-style:none;margin:0;padding:0;display:grid}
.li li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.li li:first-child{border-top:0}
.li li button.it{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink);font-size:16px}
.li li small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .d{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:110px;display:grid;align-content:start;gap:6px;background:var(--mist);min-width:0}
.cal .d.today{border:2px solid var(--red);background:var(--white)}
.cal .d.past{opacity:.6}
.cal .d h4{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:17px;display:flex;justify-content:space-between;gap:4px}
.cal .d h4 span{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);text-transform:none}
.ev{font-size:13px;line-height:1.25;padding:4px 6px;border-radius:6px;background:var(--white);border:0;border-left:4px solid var(--c,var(--navy));overflow-wrap:anywhere;text-align:left;font-family:inherit;color:var(--ink)}
button.ev{cursor:pointer}
.ev small{display:block;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.wkhd{font-family:var(--display);font-weight:700;text-transform:uppercase;color:var(--muted);font-size:16px;letter-spacing:.04em;margin:12px 0 6px}
.wkhd:first-child{margin-top:0}
@media (max-width:780px){.cal{grid-template-columns:minmax(0,1fr)}.cal .d{min-height:0}.cal .d.empty-day{display:none}}

/* toolkit */
.subtabs{display:flex;gap:8px;flex-wrap:wrap}
.subtabs button{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--white);font-weight:600;font-size:16px;cursor:pointer}
.subtabs button[aria-pressed="true"],.stages button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--white)}
.reader{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
@media (max-width:900px){.reader{grid-template-columns:minmax(0,1fr)}}
.slist{display:grid;gap:6px;align-content:start}
.slist button{text-align:left;min-height:56px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:600;font-size:17px;display:grid}
.slist button small{font-weight:400;color:var(--muted);font-size:14px}
.slist button[aria-pressed="true"]{border:2px solid var(--navy);background:var(--nbg)}
@media (max-width:900px){.slist{grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);overflow-x:auto;padding-bottom:4px}}
.script{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px 24px;min-width:0}
.script .sz{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.script .sz span{font-size:14px;color:var(--muted);margin-right:auto}
.script .sz button{min-width:48px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-weight:700;cursor:pointer}
.stext{font-size:var(--fs,26px);line-height:1.45;max-width:38ch}
.stext h3{font-size:1.15em;margin:1.1em 0 .4em;color:var(--navy)}
.stext h3:first-child{margin-top:0}
.stext p{margin:0 0 .7em}
.stext .cue{font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);display:block;margin-top:.6em}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:17px;background:var(--white);margin-bottom:10px}
.law .a .form{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.disc{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.disc b{color:var(--red)}
.banner{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:flex-start;background:var(--rbg);border:1px solid var(--rln);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.banner b{color:var(--red);white-space:nowrap}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.todo label{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer;font-size:17px}
.todo input[type=checkbox]{width:24px;height:24px;margin:0;flex:none;accent-color:var(--green)}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.todo span{overflow-wrap:anywhere}
.todo span small{display:block;font-size:14px;color:var(--muted)}
.x{background:none;border:0;color:#9BA2BD;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:12px}
.add input{min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--white);font-size:17px}
.add input[type=date]{width:160px;font-size:15px}
@media (max-width:520px){.add{grid-template-columns:minmax(0,1fr) auto}.add input[type=text]{grid-column:1/-1}.add input[type=date]{width:100%}}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 60px rgba(10,14,40,.4);color:var(--ink);background:var(--white)}
dialog::backdrop{background:rgba(20,24,51,.6)}
.dl{padding:20px;display:grid;gap:14px}
.dl .dh{display:flex;gap:10px;align-items:flex-start}
.dl .dh h2{font-size:30px;flex:1;min-width:0}
.dl .dh p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fgrid label,.fl{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.fgrid label em{font-style:normal;color:var(--red)}
.fgrid input,.fgrid select,.fgrid textarea,.fl input{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--white);font-size:17px;color:var(--ink);font-weight:400;width:100%;min-width:0}
.fgrid textarea{min-height:84px;resize:vertical}
.pv{display:grid;gap:6px}
.pv .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pv textarea{width:100%;min-height:150px;border:0;border-radius:10px;padding:12px;background:#0F1430;color:#E6E9F7;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.dfoot{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--white);padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dfoot .btn{flex:1}
.linkbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--mist)}
.results{display:grid;gap:6px;max-height:260px;overflow:auto}
.results button{display:grid;text-align:left;gap:2px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:600}
.results button small{font-weight:400;color:var(--muted);font-size:14px}
.results button:disabled{opacity:.55;cursor:default}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tagrow button{min-height:32px;padding:0 10px;border-radius:16px;border:1px dashed var(--line);background:var(--white);font-size:14px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 18px;border-radius:10px;font-size:16px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* activity feed, list view, facts */
.card.slim{padding:12px 20px}
.card.slim .hd h2{font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}

'use strict';
var API=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8787':'https://soldmike-listings.broker-e2c.workers.dev';
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysSince(iso){if(!iso)return null;var t=Date.parse(String(iso).replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(iso)?'':'Z'));return isNaN(t)?null:Math.max(0,Math.floor((Date.now()-t)/864e5));}
function ago(iso){var d=daysSince(iso);if(d==null)return '';if(d===0){var h=Math.floor((Date.now()-Date.parse(iso))/36e5);return h<1?'just now':h+' hr ago';}return d===1?'yesterday':d+' days ago';}
function fmtDay(s){if(!s)return '';var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});}

/* ---------- API ---------- */
function pin(){return store('sm_oh_pin')||'';}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'X-OH-Pin':pin(),'Content-Type':'application/json'},opt.headers||{});
  return fetch(API+'/api/hq/'+path,opt).then(function(r){if(r.status===401)throw 'pin';return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw j.error||('Error '+r.status);return j;});});}
function getJ(p){return api(p);}
function post(p,b){return api(p,{method:'POST',body:JSON.stringify(b)});}
function askPin(){return new Promise(function(res){var d=$('#pinDlg'),i=$('#pinIn'),e=$('#pinErr');
  $('#pinForm').onsubmit=function(ev){ev.preventDefault();store('sm_oh_pin',i.value.trim());getJ('desk/todos').then(function(){d.close();res();}).catch(function(){e.hidden=false;});};
  if(!d.open)d.showModal();i.focus();});}
function fail(e){if(e==='pin')return askPin().then(function(){load(true);});toast(typeof e==='string'?e:'Could not reach the server. Check the connection.');}

/* ---------- stages ---------- */

];

  {k:'talk',n:'Talking',g:'Leads',c:'#9BA2BD',p:['followup']},

/* ---------- prompts (one per skill) ---------- */

  type:{l:'Property type',opts:['Detached','Semi','Townhouse','Condo','Bungalow']},bb:{l:'Beds / baths',ph:'4 + 1 / 3'},sqft:{l:'Size (sq ft)',ph:'2,400'},notes:{l:'Notes',ta:1,full:1}};
var PROMPTS={
  homeeval:{label:'Home Evaluation',skill:'home-evaluation-dashboard',lead:'Build a home evaluation for this seller.',
    fields:['addr','client','email','phone','type','bb','sqft',{k:'why',l:'Why they asked',opts:['Curious about value','Planning to sell in 6–12 months','Selling soon','Refinancing / estate']},'notes']},
  cma:{label:'CMA',skill:'cma-generator',lead:'Prepare a CMA.',
    fields:['addr','client',{k:'purpose',l:'Purpose',opts:['Listing price','Buyer offer price']},'type','bb','sqft',{k:'comps',l:'Comps I picked (MLS® # or addresses)',ta:1,full:1},'notes']},

/* ---------- state ---------- */
var TABS=['sellers','buyers','marketing','toolkit'];
var S={tab:TABS.indexOf(location.hash.slice(1))>=0?location.hash.slice(1):(store('desk_tab')||'sellers'),
  board:{s:null,b:null},inbox:null,inboxDays:store('desk_inbox_days')||14,closed:{s:!!store('desk_closed_s'),b:!!store('desk_closed_b')},

function setTab(t){S.tab=t;store('desk_tab',t);$$('#tabnav a[data-tab]').forEach(function(a){a.setAttribute('aria-current',a.dataset.tab===t?'page':'false');});render();load(false);}
$$('#tabnav a[data-tab]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();history.replaceState(null,'','#'+a.dataset.tab);setTab(a.dataset.tab);window.scrollTo({top:0});});});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.indexOf(h)>=0&&h!==S.tab)setTab(h);});

/* load what the current tab needs (force = refresh even if loaded) */
function load(force){
  var jobs=[];
  if(S.tab==='sellers'||S.tab==='buyers'){
    ['s','b'].forEach(function(k){if(force||!S.board[k])jobs.push(getJ('desk/board?kind='+k+(force?'&pull=1':'')).then(function(j){S.board[k]=j;S.tagSync=j.tagSync;S.fubApp=j.fubApp||S.fubApp;if(j.pulled)toast(j.pulled+' added from your FUB tags');}));});
    if(force||!S.inbox)jobs.push(loadInbox());}
  if(S.tab==='marketing'&&(force||!S.content))jobs.push(getJ('desk/content').then(function(j){S.content=j.items;}));
  if(S.tab==='toolkit'&&(force||!S.todos))jobs.push(loadTodos());
  if(!jobs.length)return Promise.resolve();
  var b=$('#refresh');b.classList.add('spin');
  return Promise.all(jobs).then(function(){render();refreshViewing();}).catch(fail).then(function(){b.classList.remove('spin');});
}
function loadInbox(){return getJ('desk/inbox?days='+S.inboxDays).then(function(j){S.inbox=j;badge();}).catch(function(e){if(e==='pin')throw e;S.inbox={error:String(e),people:[]};});}
function loadTodos(){return getJ('desk/todos?today='+ymd(new Date())).then(function(j){S.todos=j.items;});}
function badge(){var n=S.inbox&&S.inbox.people?S.inbox.people.length:0;['sellers','buyers'].forEach(function(t){var a=$('#tabnav a[data-tab="'+t+'"]');a.innerHTML=t[0].toUpperCase()+t.slice(1)+(n?' <span class="n" title="Unsorted leads">'+n+'</span>':'');});}

function render(){var m=$('#main');
  var html=({sellers:viewBoard,buyers:viewBoard,marketing:viewMarketing,toolkit:viewToolkit})[S.tab]();
  var sx={};$$('.board',m).forEach(function(b){sx[b.id]=b.scrollLeft;});
  var fa=document.activeElement,fid=fa&&fa.id&&/^lq-/.test(fa.id)?fa.id:null,pos=fid?fa.selectionStart:0;
  m.innerHTML=html;
  if(fid){var el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}}
  $$('.board',m).forEach(function(b){if(sx[b.id])b.scrollLeft=sx[b.id];});
  if(S.tab==='toolkit')afterToolkit();}

var GARAGE_HINT={1:'1-car: open to a town, semi or smaller detached',2:'2-car: mostly detached, sometimes a large semi or town',3:'3-car+: luxury detached'};
function regionOf(city){return CITY_REGION[String(city||'').trim().toLowerCase()]||'';}
function parseMoney(s){if(s==null||s==='')return 0;if(typeof s==='number')return s;var m=String(s).replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*([mk])?/i);if(!m)return 0;var n=parseFloat(m[1]),u=(m[2]||'').toLowerCase();if(u==='m')n*=1e6;else if(u==='k')n*=1e3;else if(n<10)n*=1e6;else if(n<5000)n*=1e3;return Math.round(n);}
function money(n){if(!n)return '';return n>=1e6?'$'+(Math.round(n/1e4)/100).toString().replace(/\.?0+$/,'')+'M':'$'+Math.round(n/1e3)+'K';}
function ff(c){return c.facts||{};}
function cityOf(c){var f=ff(c);return f.city||c.area||'';}
function factsLine(kind,c){var f=ff(c),out=[];
  if(kind==='s'){out.push([f.hood,cityOf(c)].filter(Boolean).join(', ')||f.region);out.push(c.ptype);
    if(f.beds||f.baths)out.push([f.beds?f.beds+' bd':'',f.baths?f.baths+' ba':''].filter(Boolean).join(' · '));else if(c.size)out.push(c.size);
    if(f.garage)out.push(f.garage+(+f.garage>=3?'+':'')+'-car');if(f.sqft)out.push(f.sqft+' sf');if(f.lot)out.push('Lot '+f.lot);}
  else{out.push([f.hood,f.cities].filter(Boolean).join(', ')||f.region||c.area);out.push((f.types||[]).join('/'));
    var pr=f.pmin&&f.pmax?money(+f.pmin)+'–'+money(+f.pmax):f.pmax?'≤ '+money(+f.pmax):f.pmin?money(+f.pmin)+'+':c.budget;out.push(pr);
    if(f.beds)out.push(f.beds+'+ bd');if(f.garage)out.push(f.garage+'+ car');if(f.sqft)out.push(f.sqft+'+ sf');}
  return out.filter(Boolean).join(' · ');}
function featChips(c,max){var x=(ff(c).feats||[]);if(!x.length)return '';return '<div class="feats">'+x.slice(0,max||3).map(function(t){return '<span class="ft">'+esc(t)+'</span>';}).join('')+(x.length>(max||3)?'<span class="ft">+'+(x.length-(max||3))+'</span>':'')+'</div>';}

/* ---------- matching sellers <-> buyers ---------- */
function fits(s,b){var sf=ff(s),bf=ff(b);
  if(s.stage==='closed'||b.stage==='closed')return false;
  var cities=String(bf.cities||'').toLowerCase().split(/\s*,\s*/).filter(Boolean),sc=cityOf(s).toLowerCase(),sh=String(sf.hood||'').toLowerCase(),sr=sf.region||regionOf(cityOf(s));
  if(cities.length){if(!(cities.indexOf(sc)>=0||(sh&&cities.indexOf(sh)>=0)))return false;}
  else if(bf.region){if(sr!==bf.region)return false;}
  else return false;
  var sp=parseMoney(s.price);
  if(!sp||!(bf.pmax||bf.pmin))return false;
  if(bf.pmax&&sp>+bf.pmax*1.05)return false;if(bf.pmin&&sp<+bf.pmin*0.9)return false;
  if((bf.types||[]).length&&s.ptype&&bf.types.indexOf(s.ptype)<0)return false;
  if(bf.beds&&sf.beds&&parseInt(sf.beds,10)<parseInt(bf.beds,10))return false;
  if(bf.garage&&sf.garage&&+sf.garage<+bf.garage)return false;
  if(bf.sqft&&sf.sqft&&parseMoney(sf.sqft)<parseMoney(bf.sqft))return false;
  return true;}
function matchesFor(kind,c){var other=S.board[kind==='s'?'b':'s'];if(!other)return [];
  return other.cards.filter(function(o){return kind==='s'?fits(c,o):fits(o,c);});}
function matchChip(kind,c){var m=matchesFor(kind,c);if(!m.length)return '';return '<button type="button" class="chip mt" data-matches="'+kind+'" data-id="'+c.id+'">'+m.length+' '+(kind==='s'?'buyer':'listing')+(m.length>1?'s':'')+' match</button>';}

/* ---------- activity (from FUB timestamps) ---------- */
function ts(x){if(!x)return 0;var t=Date.parse(String(x).replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(x)?'':'Z'));return isNaN(t)?0:t;}
function mx(){var m=0;for(var i=0;i<arguments.length;i++)m=Math.max(m,ts(arguments[i]));return m;}
var DAY=864e5;
function actOf(kind,c){var L=liveOf(kind,c),a=L.act;if(!c.fub||!a)return {st:'none'};
  var inn=mx(a.rt,a.re,a.ic),out=mx(a.st,a.se,a.oc),eng=mx(a.em,a.web,a.lead),two=Math.max(inn,out),now=Date.now();
  var early=LEADSTAGES.indexOf(c.stage)>=0,lim=(early?30:14)*DAY;
  if(c.stage==='closed')return {st:'ok',inn:inn,out:out,eng:eng};
  if(inn&&inn>=out&&now-inn<7*DAY)return {st:'reply',inn:inn,out:out,eng:eng};
  if(eng&&now-eng<3*DAY&&eng>inn)return {st:'engaged',inn:inn,out:out,eng:eng};
  if(!two||now-two>lim)return {st:'stale',inn:inn,out:out,eng:eng,days:two?Math.floor((now-two)/DAY):null};
  if(out>inn&&now-out>2*DAY)return {st:'waiting',inn:inn,out:out,eng:eng,days:Math.floor((now-out)/DAY)};
  return {st:'ok',inn:inn,out:out,eng:eng};}
var ACT_LABEL={reply:'Replied',engaged:'Active',waiting:'Waiting',stale:'Stale',ok:'',none:''};
function dot(kind,c){var a=actOf(kind,c);return '<i class="dot '+a.st+'" title="'+esc(ACT_LABEL[a.st]||'No FUB link')+'"></i>';}
function actChip(kind,c){var a=actOf(kind,c);
  if(a.st==='reply')return '<span class="chip g">Replied '+esc(agoMs(a.inn))+'</span>';
  if(a.st==='engaged')return '<span class="chip n">Active '+esc(agoMs(a.eng))+'</span>';
  if(a.st==='waiting')return '<span class="chip a">Waiting '+a.days+' d</span>';
  if(a.st==='stale')return '<span class="chip r">Stale'+(a.days!=null?' '+a.days+' d':'')+'</span>';
  return '';}
function agoMs(t){if(!t)return '';var d=Date.now()-t;if(d<36e5)return 'just now';if(d<DAY)return Math.floor(d/36e5)+' hr ago';var n=Math.floor(d/DAY);return n===1?'yesterday':n+' d ago';}
var EV={rt:['replied by text','g'],re:['replied by email','g'],ic:['called you','g'],em:['opened or clicked an email','n'],web:['was on your website','n'],lead:['new website activity','n'],st:['You texted','o'],se:['You emailed','o'],oc:['You called','o']};
function feedEvents(kind){var B=S.board[kind];if(!B)return [];var since=Date.now()-S.feedDays*DAY,out=[];
  B.cards.forEach(function(c){var L=liveOf(kind,c),a=L.act;if(!a||c.stage==='closed')return;
    Object.keys(EV).forEach(function(k){var t=ts(a[k]);if(!t||t<since)return;if(k==='lead'&&Math.abs(t-ts(a.web))<36e5)return;out.push({c:c,k:k,t:t});});});
  return out.sort(function(x,y){return y.t-x.t;});}
function feed(kind){
  var B=S.board[kind];
  var head='<div class="hd"><h2>Activity</h2><span class="sub">What your '+(kind==='s'?'sellers':'buyers')+' did, from Follow Up Boss</span>'
    +'<select class="selsm" id="feedDays" aria-label="How far back">'+[1,2,7].map(function(d){return '<option value="'+d+'"'+(S.feedDays===d?' selected':'')+'>Last '+(d===1?'24 hours':d+' days')+'</option>';}).join('')+'</select>'
    +'<label class="sw"><input type="checkbox" data-feedon'+(S.feedOn?' checked':'')+'><i></i>Show</label></div>';
  if(!S.feedOn)return '<section class="card slim"><div class="hd" style="margin:0"><h2>Activity</h2><span class="sub">Hidden</span><label class="sw"><input type="checkbox" data-feedon><i></i>Show</label></div></section>';
  if(!B)return '<section class="card">'+head+'<p class="empty">Loading…</p></section>';
  var cards=B.cards.filter(function(c){return c.stage!=='closed';});
  var cnt={reply:0,engaged:0,waiting:0,stale:0};cards.forEach(function(c){var s=actOf(kind,c).st;if(cnt[s]!=null)cnt[s]++;});
  var chips=[['all','All activity'],['reply','Replied',cnt.reply,'g'],['engaged','Active',cnt.engaged,'n'],['waiting','Waiting',cnt.waiting,'a'],['stale','Stale',cnt.stale,'r']];
  var bar='<div class="fchips" role="toolbar" aria-label="Filter activity">'+chips.map(function(x){return '<button type="button" data-ff="'+x[0]+'" aria-pressed="'+(S.feedFilter===x[0])+'" class="'+(x[3]||'')+'">'+x[1]+(x[2]!=null?' <b>'+x[2]+'</b>':'')+'</button>';}).join('')+'</div>';
  var body;
  if(S.feedFilter==='all'){var ev=feedEvents(kind),show=S.feedAll?ev:ev.slice(0,10);
    body=ev.length?'<ul class="feed">'+show.map(function(e){var nm=e.c.name||liveOf(kind,e.c).name||e.c.addr,lab=EV[e.k];
      return '<li class="'+lab[1]+'"><button type="button" data-view="'+kind+'" data-id="'+e.c.id+'"><i class="dot '+(lab[1]==='g'?'reply':lab[1]==='n'?'engaged':'ok')+'"></i><span>'+(lab[1]==='o'?esc(lab[0])+' <b>'+esc(nm)+'</b>':'<b>'+esc(nm)+'</b> '+esc(lab[0]))+'</span><small>'+esc(agoMs(e.t))+'</small></button></li>';}).join('')+'</ul>'
      +(ev.length>10?'<button type="button" class="more" data-feedall>'+(S.feedAll?'Show less':'Show all '+ev.length)+'</button>':'')

  else{var L=cards.filter(function(c){return actOf(kind,c).st===S.feedFilter;}).sort(function(a,b){var x=actOf(kind,a),y=actOf(kind,b);return (y.inn||y.eng||0)-(x.inn||x.eng||0);});
    body=L.length?'<ul class="feed">'+L.map(function(c){return '<li><button type="button" data-view="'+kind+'" data-id="'+c.id+'">'+dot(kind,c)+'<span><b>'+esc(c.name||liveOf(kind,c).name||c.addr)+'</b> '+stageName(kind,c.stage)+'</span><small>'+actChip(kind,c)+'</small></button></li>';}).join('')+'</ul>':'<p class="empty">Nobody here.</p>';}
  return '<section class="card">'+head+bar+body+(B.liveError?'<p class="err">Follow Up Boss didn’t answer. Try Refresh.</p>':'')+'</section>';
}
function stageName(kind,k){var s=stagesOf(kind).filter(function(x){return x.k===k;})[0];return s?'<span class="muted" style="font-size:14px">· '+esc(s.n)+'</span>':'';}

/* ---------- boards ---------- */

    +'<div class="seg" role="group" aria-label="View"><button type="button" data-bv="board" aria-pressed="'+(view==='board')+'">Board</button><button type="button" data-bv="list" aria-pressed="'+(view==='list')+'">List</button></div>'

function cardHtml(kind,c){var st=stagesOf(kind).filter(function(x){return x.k===c.stage;})[0]||stagesOf(kind)[0];return kind==='s'?sellerCard(c,st):buyerCard(c,st);}

/* list view: find people fast, tap to open the card */
var SORTS={stage:'Stage',quiet:'Longest since contact',recent:'Most recent activity',name:'Name',price:'Price'};
function filtered(kind){
  var F=S.filter[kind],q=F.q.trim().toLowerCase(),ST=stagesOf(kind);
  var L=S.board[kind].cards.filter(function(c){
    if(c.stage==='closed'&&!S.closed[kind]&&F.stage!=='closed')return false;
    if(F.stage&&c.stage!==F.stage)return false;
    if(F.region){var r=ff(c).region||regionOf(kind==='s'?cityOf(c):String(ff(c).cities||'').split(',')[0]);if(r!==F.region)return false;}
    if(F.act&&actOf(kind,c).st!==F.act)return false;
    if(q){var L2=liveOf(kind,c),hay=[c.name,L2.name,c.addr,c.email,c.phone,L2.phone,cityOf(c),ff(c).hood,ff(c).cities,c.note,c.next,(ff(c).feats||[]).join(' ')].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;});
  var order={};ST.forEach(function(s,i){order[s.k]=i;});
  var two=function(c){var a=actOf(kind,c);return Math.max(a.inn||0,a.out||0);};
  var srt={stage:function(a,b){return order[a.stage]-order[b.stage]||String(a.name).localeCompare(String(b.name));},
    quiet:function(a,b){return two(a)-two(b);},
    recent:function(a,b){var x=actOf(kind,a),y=actOf(kind,b);return Math.max(y.inn||0,y.eng||0)-Math.max(x.inn||0,x.eng||0);},
    name:function(a,b){return String(a.name||a.addr).localeCompare(String(b.name||b.addr));},
    price:function(a,b){var pa=kind==='s'?parseMoney(a.price):+ff(a).pmax||0,pb=kind==='s'?parseMoney(b.price):+ff(b).pmax||0;return pb-pa;}};
  return L.sort(srt[S.sort[kind]]||srt.stage);
}
function listView(kind){

   +'<select class="selsm" data-lf="stage" aria-label="Stage"><option value="">All stages</option>'+ST.map(function(s){return '<option value="'+s.k+'"'+(F.stage===s.k?' selected':'')+'>'+esc(s.n)+'</option>';}).join('')+'</select>'
   +'<select class="selsm" data-lf="region" aria-label="Region"><option value="">All regions</option>'+REGIONS.map(function(r){return '<option'+(F.region===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select>'
   +'<select class="selsm" data-lf="act" aria-label="Activity"><option value="">Any activity</option>'+[['reply','Replied'],['engaged','Active'],['waiting','Waiting'],['stale','Stale']].map(function(a){return '<option value="'+a[0]+'"'+(F.act===a[0]?' selected':'')+'>'+a[1]+'</option>';}).join('')+'</select>'
   +'<select class="selsm" data-lsort aria-label="Sort">'+Object.keys(SORTS).map(function(k){return '<option value="'+k+'"'+(S.sort[kind]===k?' selected':'')+'>Sort: '+SORTS[k]+'</option>';}).join('')+'</select></div>';

function listBody(kind){

    var st=ST.filter(function(x){return x.k===c.stage;})[0]||{};
    return '<li class="row'+(sel[c.id]?' on':'')+'"><input type="checkbox" class="rc" data-sel="'+kind+'" value="'+c.id+'"'+(sel[c.id]?' checked':'')+' aria-label="Select '+esc(title)+'">'
     +'<button type="button" class="rm" data-view="'+kind+'" data-id="'+c.id+'">'+dot(kind,c)+'<span class="rt2"><b>'+esc(title)+'</b>'+(sub?' <span class="muted">· '+esc(sub)+'</span>':'')+'<small>'+esc(factsLine(kind,c)||'Add facts: tap, then Edit')+'</small>'+featChips(c,3)+'</span></button>'
     +'<div class="rs"><span class="chip" style="border-left:4px solid '+(st.c||'#9BA2BD')+'">'+esc(st.n||'')+'</span>'+(actChip(kind,c)||(c.fub?lastChip(Lv.last):''))+matchChip(kind,c)+'</div></li>';}).join('')+'</ul>';
}
function refreshList(kind){var b=document.getElementById('lbody-'+kind);if(b)b.innerHTML=listBody(kind);}

/* cards */
function moveRow(kind,c){var ST=stagesOf(kind);
  return '<div class="pfoot"><select data-move="'+kind+'" data-id="'+c.id+'" aria-label="Move to stage">'+ST.map(function(st){return '<option value="'+st.k+'"'+(st.k===c.stage?' selected':'')+'>'+esc(st.n)+'</option>';}).join('')+'</select>'
   +'<button type="button" class="lk" data-edit="'+kind+'" data-id="'+c.id+'">Edit</button>'
   +(c.fub?'<a class="lk" href="'+fubUrl(c.fub)+'" target="_blank" rel="noopener">FUB</a>':'')+'</div>';}
function sellerCard(c,st){
  var L=liveOf('s',c),all=['homeeval','cma','update','instructions','offers','justsold'],hot=st.p,rest=all.filter(function(k){return hot.indexOf(k)<0;});
  var done=c.checks||[],left=st.due.filter(function(d){return done.indexOf(d)<0;}).length;
  var title=c.addr||c.name||L.name||'No name',sub=c.addr?(c.name||L.name):'';
  return '<article class="pc"><div class="t"><b>'+dot('s',c)+esc(title)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>'
    +(factsLine('s',c)?'<div class="fl2">'+esc(factsLine('s',c))+'</div>':'')+featChips(c,3)
    +'<div class="meta">'+(c.price?'<span class="chip n">'+esc(c.price)+'</span>':'')+(c.fub?(actChip('s',c)||lastChip(L.last)):'<span class="chip">Not linked to FUB</span>')+matchChip('s',c)+'</div>'
    +(c.note?'<div class="note">'+esc(c.note)+'</div>':'')
    +'<div class="due"><div class="dh">Due now · '+(left?left+' left':'all done')+'</div>'+st.due.map(function(d){return '<label><input type="checkbox" data-check="'+c.id+'" value="'+esc(d)+'"'+(done.indexOf(d)>=0?' checked':'')+'><span>'+esc(d)+'</span></label>';}).join('')+'</div>'
    +'<div class="pacts">'+hot.map(function(k){return pbtn(k,'s',c.id,1);}).join('')+'</div>'
    +'<button type="button" class="morebtn" data-more aria-expanded="false">All prompts</button><div class="pacts" hidden>'+rest.map(function(k){return pbtn(k,'s',c.id);}).join('')+'</div>'
    +moveRow('s',c)+'</article>';
}
function buyerCard(c,st){
  var L=liveOf('b',c),all=['listings','followup','showings','cma'],hot=st.p,rest=all.filter(function(k){return hot.indexOf(k)<0;});
  var ph=L.phone||c.phone,em=L.email||c.email,f=ff(c);
  return '<article class="pc"><div class="t"><b>'+dot('b',c)+esc(c.name||L.name||'No name')+'</b><span>'+[ph,em].filter(Boolean).map(esc).join(' · ')+'</span></div>'
    +(factsLine('b',c)?'<div class="fl2">'+esc(factsLine('b',c))+'</div>':'<div class="fl2 muted">No search criteria yet. Tap Edit.</div>')+featChips(c,3)
    +(f.garage&&GARAGE_HINT[Math.min(3,+f.garage)]?'<div class="hint">'+esc(GARAGE_HINT[Math.min(3,+f.garage)])+'</div>':'')
    +'<div class="meta">'+(c.pre?'<span class="chip">Pre-approved: '+esc(c.pre)+'</span>':'')+(c.fub?(actChip('b',c)||lastChip(L.last)):'<span class="chip">Not linked to FUB</span>')+matchChip('b',c)+'</div>'
    +(c.want?'<div class="note">'+esc(c.want)+'</div>':'')
    +'<div class="due"><div class="dh">Next step</div><div style="font-size:15px;font-weight:600">'+(c.next?esc(c.next):'<span class="muted" style="font-weight:400">Not set. Tap Edit.</span>')+'</div></div>'
    +(c.note?'<div class="note muted">'+esc(c.note)+'</div>':'')
    +'<div class="pacts">'+hot.map(function(k){return pbtn(k,'b',c.id,1);}).join('')+rest.map(function(k){return pbtn(k,'b',c.id);}).join('')+'</div>'
    +moveRow('b',c)+'</article>';
}
/* open one card on its own (from the list, the feed or a match) */
function viewCard(kind,id){var c=cardById(kind,id);if(!c)return;S.viewing={kind:kind,id:+id};var d=$('#dlg');
  d.innerHTML='<div class="dl cardview"><div class="dh"><h2>'+(kind==='s'?'Seller':'Buyer')+'</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>'+cardHtml(kind,c)+'</div>';
  if(!d.open)d.showModal();}
function refreshViewing(){var v=S.viewing,d=$('#dlg');if(v&&d.open&&$('.cardview',d))viewCard(v.kind,v.id);}
function openMatches(kind,id){var c=cardById(kind,id),m=matchesFor(kind,c),ok=kind==='s'?'b':'s',d=$('#dlg');S.viewing=null;
  d.innerHTML='<div class="dl"><div class="dh"><div style="flex:1;min-width:0"><h2>'+(kind==='s'?'Buyers who fit':'Listings that fit')+'</h2><p>'+esc(kind==='s'?(c.addr||c.name):(c.name))+' · '+esc(factsLine(kind,c))+'</p></div><button type="button" class="x" data-close aria-label="Close">×</button></div>'
   +'<ul class="rows">'+m.map(function(o){return '<li class="row"><button type="button" class="rm" data-view="'+ok+'" data-id="'+o.id+'">'+dot(ok,o)+'<span class="rt2"><b>'+esc(ok==='s'?(o.addr||o.name):o.name)+'</b><small>'+esc(factsLine(ok,o))+'</small>'+featChips(o,3)+'</span></button></li>';}).join('')+'</ul>'
   +'<p class="muted" style="font-size:14px;margin:0">Matched when area and price fit (price within 5% over their top), plus type, beds, garage and size when both sides have them. Features are shown but not required.</p></div>';
  if(!d.open)d.showModal();}

function resTiles(list){return '<div class="res">'+list.map(function(r){return '<a class="rt" href="'+r[3]+'" target="_blank" rel="noopener"><span class="k">'+esc(r[0])+'</span><b>'+esc(r[1])+'</b><p>'+esc(r[2])+'</p></a>';}).join('')+'</div>';}
function sellerRes(){return '<section class="card"><div class="hd"><h2>Seller resources</h2><span class="sub">Guides and pages to send sellers</span></div>'+resTiles([
  ['Guide','Seller’s Guide','The full guide page on soldmike.com.','/sell/seller-guide/'],
  ['PDF','Selling a Home in Vaughan','Free guide PDF to email or print.','/guides/selling-a-home-in-vaughan.pdf'],
  ['Package','Pre-Listing Package','Send before the listing presentation.','/sell/pre-listing/'],
  ['Page','How We Market','Photos, video, launch plan.','/sell/how-we-market/'],
  ['Page','Cost to Sell in Vaughan','Commission, legal, moving costs.','/sell/cost-to-sell-vaughan/'],
  ['Page','Home Value','The home value request page.','/sell/home-value/'],
  ['Q&A','Seller questions','Common questions, answered on the site.','/questions/selling/'],
  ['Results','Case studies','Recent results to show sellers.','/results/']])+'</section>';}
function buyerRes(){return '<section class="card"><div class="hd"><h2>Buyer resources</h2><span class="sub">Guides and pages to send buyers</span></div>'+resTiles([
  ['Guide','Buyer’s Guide','The full guide page on soldmike.com.','/buy/buyer-guide/'],
  ['PDF','Buying a Home in Vaughan','Free guide PDF to email or print.','/guides/buying-a-home-in-vaughan.pdf'],
  ['Search','Listings search','Search and save homes with the buyer.','/listings/'],
  ['Page','Pre-construction','For buyers looking at new builds.','/buy/pre-construction/'],
  ['Areas','Neighbourhoods','Vaughan, Kleinburg, Maple, Woodbridge and more.','/neighbourhoods/'],

  ['Ontario','Land transfer tax','Ontario rules + first-time buyer refund.','https://www.ontario.ca/document/land-transfer-tax'],
  ['Form','Buyer Representation Agreement','OREA Form 371 (needed in writing before working for a buyer).','https://www.reco.on.ca/']])+'</section>';}

/* ---------- card dialog (add / edit / link FUB) ---------- */
var edit=null;
function inp(id,label,v,o){o=o||{};return '<label class="'+(o.full?'full':'')+'" for="'+id+'"><span>'+esc(label)+'</span>'+(o.ta?'<textarea id="'+id+'">'+esc(v)+'</textarea>':'<input id="'+id+'" value="'+esc(v==null?'':v)+'" autocomplete="off"'+(o.list?' list="'+o.list+'"':'')+(o.num?' inputmode="numeric"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>')+'</label>';}
function sel(id,label,v,opts,o){o=o||{};return '<label class="'+(o.full?'full':'')+'" for="'+id+'"><span>'+esc(label)+'</span><select id="'+id+'"><option value="">—</option>'+opts.map(function(x){var val=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return '<option value="'+esc(val)+'"'+(String(val)===String(v==null?'':v)?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></label>';}
function chipsPick(id,label,list,on){return '<div class="full pick" id="'+id+'"><span class="pl">'+esc(label)+'</span><div class="pchips">'+list.map(function(t){return '<button type="button" class="pk" aria-pressed="'+((on||[]).indexOf(t)>=0)+'" data-pk="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+'</div></div>';}
var GARAGES=[['1','1-car'],['2','2-car'],['3','3-car+']];
function openCard(kind,id){
  var c=id?cardById(kind,id):{kind:kind,stage:'talk',fub:null,facts:{}};edit={kind:kind,c:Object.assign({},c),confirmDel:false};S.viewing=null;
  var ST=stagesOf(kind),f=ff(c),d=$('#dlg'),g;
  if(kind==='s')g=sel('c_stage','Stage',c.stage,ST.map(function(s){return [s.k,s.n];}))+inp('c_name','Client name',c.name)
    +inp('c_addr','Property address',c.addr,{full:1})+inp('f_hood','Neighbourhood',f.hood,{list:'dlHood'})+inp('f_city','City',f.city||c.area,{list:'dlCity'})
    +sel('f_region','Region',f.region||regionOf(f.city||c.area),REGIONS)+sel('c_ptype','Property type',c.ptype,TYPES)
    +inp('f_beds','Bedrooms',f.beds,{ph:'4+1'})+inp('f_baths','Bathrooms',f.baths,{ph:'3'})+sel('f_garage','Garage',f.garage,GARAGES)+inp('f_sqft','Size (sq ft)',f.sqft,{ph:'2,400'})
    +inp('f_lot','Lot',f.lot,{ph:'50 x 120'})+inp('c_price','Price (list, sold or value)',c.price,{ph:'$1,349,000'})
    +chipsPick('f_feats','Features',FEATS,f.feats)+inp('c_email','Email',c.email)+inp('c_phone','Phone',c.phone)+inp('c_note','Notes',c.note,{ta:1,full:1});
  else g=sel('c_stage','Stage',c.stage,ST.map(function(s){return [s.k,s.n];}))+inp('c_name','Client name',c.name)
    +sel('f_region','Region',f.region,REGIONS)+inp('f_cities','Cities (comma between)',f.cities||c.area,{list:'dlCity',ph:'Vaughan, King'})
    +inp('f_hood','Neighbourhoods',f.hood,{list:'dlHood',ph:'Sonoma Heights'})+inp('f_pmin','Price from',f.pmin?money(+f.pmin):'',{ph:'$1.2M'})+inp('f_pmax','Price up to',f.pmax?money(+f.pmax):(c.budget||''),{ph:'$1.5M'})
    +chipsPick('f_types','Property types',TYPES,f.types)
    +inp('f_beds','Bedrooms (min)',f.beds,{ph:'4'})+inp('f_baths','Bathrooms (min)',f.baths,{ph:'3'})+sel('f_garage','Garage (min)',f.garage,GARAGES)+inp('f_sqft','Size (min sq ft)',f.sqft,{ph:'2,500'})
    +'<p class="full hint" id="gHint">'+esc(GARAGE_HINT[f.garage]||'')+'</p>'
    +chipsPick('f_feats','Must-haves / wants',FEATS,f.feats)+inp('c_pre','Pre-approval',c.pre,{ph:'$1.5M, TD, Oct 1'})+inp('c_next','Next step',c.next,{full:1})
    +inp('c_want','In their words',c.want,{full:1,ph:'Wants a quiet street near schools'})+inp('c_email','Email',c.email)+inp('c_phone','Phone',c.phone)+inp('c_note','Notes',c.note,{ta:1,full:1});
  d.innerHTML='<form class="dl" id="cardF"><div class="dh"><div style="flex:1;min-width:0"><h2>'+(id?'Edit ':'Add ')+(kind==='s'?'seller':'buyer')+'</h2><p>'+(id?'Changes save to the board.':'Find them in Follow Up Boss first, or fill it in by hand.')+'</p></div><button type="button" class="x" data-close aria-label="Close">×</button></div>'
   +'<div class="linkbox" id="linkBox"></div><div class="fgrid">'+g+'</div>'
   +'<datalist id="dlCity">'+CITIES.map(function(x){return '<option value="'+x+'">';}).join('')+'</datalist><datalist id="dlHood">'+HOODS.map(function(x){return '<option value="'+x+'">';}).join('')+'</datalist>'
   +'<p class="err" id="cErr" hidden></p></form>'
   +'<div class="dfoot"><button type="button" class="btn" id="cSave">Save</button>'
   +(id?'<button type="button" class="btn ghost" id="cArch">'+(c.archived?'Restore':'Archive')+'</button><button type="button" class="btn danger" id="cDel">Delete</button>':'<button type="button" class="btn ghost" data-close>Cancel</button>')+'</div>';
  drawLink();
  $('#cardF').onsubmit=function(e){e.preventDefault();};
  $$('.pk',d).forEach(function(b){b.onclick=function(){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));};});
  var city=$('#f_city');if(city)city.addEventListener('change',function(){var r=regionOf(city.value);if(r)$('#f_region').value=r;});
  var cs=$('#f_cities');if(cs)cs.addEventListener('change',function(){var r=regionOf(cs.value.split(',')[0]);if(r&&!$('#f_region').value)$('#f_region').value=r;});
  var gs=$('#f_garage'),gh=$('#gHint');if(gs&&gh)gs.addEventListener('change',function(){gh.textContent=GARAGE_HINT[gs.value]||'';});
  $('#cSave').onclick=saveCard;
  if(id){$('#cArch').onclick=function(){post('desk/card/archive',{id:id,on:!c.archived}).then(function(){d.close();toast(c.archived?'Restored':'Archived. It’s under Archived at the bottom of the board.');load(true);}).catch(fail);};
    $('#cDel').onclick=function(){if(!edit.confirmDel){edit.confirmDel=true;this.textContent='Tap again to delete for good';return;}post('desk/card/delete',{id:id}).then(function(){d.close();toast('Deleted');load(true);}).catch(fail);};}
  if(!d.open)d.showModal();
}
function drawLink(){
  var c=edit.c,box=$('#linkBox'),L=c.fub?(liveOf(edit.kind,c)):{};
  if(c.fub){box.innerHTML='<div class="row2"><span class="chip g">Linked to FUB</span><b>'+esc(L.name||c.name||('#'+c.fub))+'</b><a class="lnkb" href="'+fubUrl(c.fub)+'" target="_blank" rel="noopener">Open</a><button type="button" class="lnkb" id="unlink">Unlink</button></div>';
    $('#unlink').onclick=function(){c.fub=null;drawLink();};return;}
  var tags=edit.kind==='s'?['Daily Seller','CMA','Appoinment']:['Daily','Searching','Appoinment'];
  box.innerHTML='<label class="fl" for="fq">Find in Follow Up Boss (name, email or phone)<input id="fq" type="search" autocomplete="off" placeholder="e.g. Marchetti"></label>'
   +'<div class="tagrow"><span class="muted" style="font-size:14px;align-self:center">Or pick from tag:</span>'+tags.map(function(t){return '<button type="button" data-tag="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+'</div><div class="results" id="fres"></div>';
  var tm;$('#fq').addEventListener('input',function(){var v=this.value.trim();clearTimeout(tm);if(v.length<2){$('#fres').innerHTML='';return;}tm=setTimeout(function(){fubSearch('q='+encodeURIComponent(v));},350);});
  $$('[data-tag]',box).forEach(function(b){b.onclick=function(){fubSearch('tag='+encodeURIComponent(b.dataset.tag));};});
}
function fubSearch(qs){var r=$('#fres');r.innerHTML='<p class="empty">Searching…</p>';
  getJ('desk/fub?'+qs).then(function(j){
    if(!j.people.length){r.innerHTML='<p class="empty">Nobody found.</p>';return;}
    r.innerHTML=j.people.map(function(p,i){var on=p.onBoard&&p.onBoard.indexOf(edit.kind)>=0;
      return '<button type="button" data-pick="'+i+'"'+(on?' disabled':'')+'>'+esc(p.name||'No name')+'<small>'+esc([p.phone,p.email,p.stage].filter(Boolean).join(' · '))+(on?' · already on this board':'')+'</small></button>';}).join('');
    $$('[data-pick]',r).forEach(function(b){b.onclick=function(){var p=j.people[+b.dataset.pick];edit.c.fub=p.id;
      [['name',p.name],['email',p.email],['phone',p.phone]].forEach(function(x){var el=$('#c_'+x[0]);if(el&&!el.value)el.value=x[1]||'';});
      if(edit.kind==='b'&&p.price&&+p.price>3300&&!$('#f_pmax').value)$('#f_pmax').value=money(+p.price);
      edit.c.name=edit.c.name||p.name;drawLink();};});
  }).catch(function(e){r.innerHTML='<p class="err">'+esc(e==='pin'?'PIN needed':e)+'</p>';});}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function picked(id){return $$('#'+id+' .pk[aria-pressed="true"]').map(function(b){return b.dataset.pk;});}
function saveCard(){
  var kind=edit.kind,b={kind:kind,id:edit.c.id||null,fub:edit.c.fub||null,stage:val('c_stage')||'talk'},f={};
  ['name','email','phone','note','addr','ptype','price','pre','next','want'].forEach(function(k){b[k]=val('c_'+k);});
  if(kind==='s'){f.hood=val('f_hood');f.city=val('f_city');f.region=val('f_region')||regionOf(f.city);f.beds=val('f_beds');f.baths=val('f_baths');f.garage=val('f_garage');f.sqft=val('f_sqft');f.lot=val('f_lot');b.area=f.city;}
  else{f.region=val('f_region');f.cities=val('f_cities');f.hood=val('f_hood');f.pmin=parseMoney(val('f_pmin'))||'';f.pmax=parseMoney(val('f_pmax'))||'';f.types=picked('f_types');f.beds=val('f_beds');f.baths=val('f_baths');f.garage=val('f_garage');f.sqft=val('f_sqft');
    if(!f.region)f.region=regionOf(f.cities.split(',')[0]);b.area=f.cities;b.budget='';}
  f.feats=picked('f_feats');
  Object.keys(f).forEach(function(k){if(f[k]===''||(Array.isArray(f[k])&&!f[k].length))delete f[k];});
  b.facts=f;
  if(!b.name&&!b.addr){var e=$('#cErr');e.textContent='Add a name'+(kind==='s'?' or an address':'')+'.';e.hidden=false;return;}
  post('desk/card',b).then(function(){$('#dlg').close();toast('Saved');if(b.stage==='closed')S.closed[kind]=true;load(true);}).catch(fail);
}
function openArchived(kind){
  getJ('desk/board?kind='+kind+'&archived=1').then(function(j){var d=$('#dlg');var ST=stagesOf(kind);S.viewing=null;
    d.innerHTML='<div class="dl"><div class="dh"><h2>Archived</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>'
     +(j.cards.length?'<ul class="li">'+j.cards.map(function(c){return '<li><div><b>'+esc(c.addr||c.name)+'</b><small>'+esc((ST.filter(function(s){return s.k===c.stage;})[0]||{}).n||'')+(c.addr&&c.name?' · '+esc(c.name):'')+'</small></div><button class="btn sm ghost" type="button" data-restore="'+c.id+'">Restore</button></li>';}).join('')+'</ul>':'<p class="empty">Nothing archived.</p>')+'</div>';
    $$('[data-restore]',d).forEach(function(b){b.onclick=function(){post('desk/card/archive',{id:+b.dataset.restore,on:false}).then(function(){d.close();toast('Restored');load(true);}).catch(fail);};});
    if(!d.open)d.showModal();}).catch(fail);
}

/* ---------- Marketing ---------- */
var AREAS=[['newsletter','Newsletter','#D7141E',['newsletter']],['social','Social posts','#1D2870',['social']],['doorhanger','Door hangers','#1B7A3E',['doorhanger']],['video','Videos','#9A5B00',['ytdesc','thumb']]];
var STATUS=['Idea','To do','In progress','Scheduled','Done'];
function areaColor(a){var x=AREAS.filter(function(y){return y[0]===a;})[0];return x?x[2]:'#545B78';}
// recurring series already scheduled in Metricool (Morning Mindset, Buying & Selling Steps)
function series(day){var out=[],dow=new Date(day+'T12:00:00').getDay();
  if(day>='2026-09-28'&&day<='2026-12-27')out.push({t:'Morning Mindset',s:'6 AM · Metricool',c:'#9BA2BD'});
  if(day>='2026-09-29'&&day<='2027-01-07'&&(dow===2||dow===4))out.push({t:'Buying & Selling Steps',s:'2 PM · Metricool',c:'#4A5592'});
  return out;}
function viewMarketing(){
  if(!S.content)return '<section class="card"><p class="empty">Loading…</p></section>';
  var now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));var today=ymd(now);
  var weeks=[0,1].map(function(w){var days=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+w*7+i);days.push(ymd(d));}return days;});
  var cal=weeks.map(function(days,w){return '<div class="wkhd">'+(w?'Next week':'This week')+' · '+fmtDay(days[0])+'</div><div class="cal">'+days.map(function(day){
    var its=S.content.filter(function(x){return x.due===day;}),sr=series(day),has=its.length;
    return '<div class="d'+(day===today?' today':'')+(day<today?' past':'')+(has||day===today?'':' empty-day')+'"><h4>'+new Date(day+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short'})+' <span>'+new Date(day+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})+'</span></h4>'
      +its.map(function(x){return '<button type="button" class="ev" data-item="'+x.id+'" style="--c:'+areaColor(x.area)+'">'+esc(x.title)+'<small>'+esc(x.status||'')+(x.done?' · done':'')+'</small></button>';}).join('')
      +sr.map(function(x){return '<div class="ev" style="--c:'+x.c+'">'+esc(x.t)+'<small>'+esc(x.s)+'</small></div>';}).join('')+'</div>';}).join('')+'</div>';}).join('');
  var legend='<div class="legend">'+AREAS.map(function(a){return '<span><i style="--c:'+a[2]+'"></i>'+a[1]+'</span>';}).join('')+'<span><i style="--c:#9BA2BD"></i>Morning Mindset</span><span><i style="--c:#4A5592"></i>Buying & Selling Steps</span></div>';
  var secs=AREAS.map(function(a){var its=S.content.filter(function(x){return x.area===a[0]&&!x.done;});
    return '<section class="card"><div class="hd"><h2>'+a[1]+'</h2><button class="btn sm ghost" type="button" data-newitem="'+a[0]+'">+ Add</button></div>'

function buildPrompt(){

  var kl=S.tab==='sellers'?'s':'b';
  if(ds.lf){S.filter[kl][ds.lf]=t.value;refreshList(kl);return;}
  if(t.hasAttribute('data-lsort')){S.sort[kl]=t.value;store('desk_sort_'+kl,t.value);refreshList(kl);return;}
  if(ds.sel){if(t.checked)S.sel[ds.sel][t.value]=1;else delete S.sel[ds.sel][t.value];refreshList(ds.sel);return;}
  if(t.id==='bulkStage'&&t.value){var ids2=Object.keys(S.sel[kl]).map(Number),st2=t.value;post('desk/card/move-many',{kind:kl,ids:ids2,stage:st2}).then(function(){S.sel[kl]={};toast(ids2.length+' moved to '+stagesOf(kl).filter(function(x){return x.k===st2;})[0].n);load(true);}).catch(fail);return;}
  if(ds.move){var kind=ds.move,c=cardById(kind,ds.id),st=t.value;post('desk/card/move',{id:c.id,stage:st}).then(function(j){c.stage=st;c.checks=c.checks||[];
      if(st==='closed'){S.closed[kind]=true;}render();refreshViewing();toast('Moved to '+stagesOf(kind).filter(function(x){return x.k===st;})[0].n+(S.tagSync&&c.fub&&j.tagged===false?' (FUB tag not updated)':''));}).catch(fail);return;}
  if(ds.check){var c2=cardById('s',ds.check),v=t.value,ch=(c2.checks||[]).filter(function(x){return x!==v;});if(t.checked)ch.push(v);c2.checks=ch;
    var card=t.closest('.pc'),left=$$('[data-check]',card).filter(function(x){return !x.checked;}).length;$('.dh',card).textContent='Due now · '+(left?left+' left':'all done');
    post('desk/card/checks',{id:c2.id,checks:ch}).catch(fail);return;}
  if(ds.td){post('item/done',{id:+ds.td,done:t.checked}).then(function(){var x=S.todos.filter(function(y){return y.id===+ds.td;})[0];if(x)x.done=t.checked?1:0;}).catch(fail);return;}
});
$('#dlg').addEventListener('click',function(e){if(e.target===$('#dlg'))$('#dlg').close();});
$('#dlg').addEventListener('close',function(){S.viewing=null;});
document.addEventListener('input',function(e){var t=e.target;if(t.id&&/^lq-[sb]$/.test(t.id)){var k=t.id.slice(3);S.filter[k].q=t.value;refreshList(k);}});

setTab(S.tab);
})();
</script>
</body>
</html>
