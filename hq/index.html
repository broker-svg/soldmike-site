<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HQ | SoldMike</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D2870">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HQ">
<link rel="apple-touch-icon" href="/open-house/icon-192.png">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* HQ (host PIN): Michael's daily dashboard. Today + 3-day outlook, follow-ups, to-dos, Daily Drive, projects, workout, meals.
   Same look as the back office and Leads pages. */
:root{--navy:#1D2870;--navy2:#26338A;--ink:#141833;--red:#D7141E;--mist:#F7F8FB;--line:#DCE0EC;--muted:#545B78;--pale:#C9D0F2;--green:#1B7A3E;--amber:#9A5B00;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
a{color:var(--navy)}
.muted{color:var(--muted)}
.err{color:var(--red);font-weight:600;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none}
.btn.navy{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px;border-radius:8px}

/* top bar + hero */
.bar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.bar>:last-child{justify-self:end;display:flex;gap:8px}
.bar img{height:42px;width:auto;display:block}
.bar b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.bar a.lnk,.bar button{background:none;border:1px solid #4A5592;color:#fff;border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.bar button.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:560px){.hide-sm{display:none}}
.hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:0 16px 14px}
.hero .in{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:24px;align-items:end}
.hero .dow{font-family:var(--display);font-weight:800;font-size:44px;line-height:.85;text-transform:uppercase;letter-spacing:.01em}
.hero .date{font-size:17px;color:var(--pale);margin-top:2px}
.hol{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:15px}
.hol i{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.clock{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.clock small{font-size:24px;margin-left:4px}
.wx{color:var(--pale);font-size:17px;margin-top:8px}
.wx b{color:#fff}
.mon b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.mon .row{display:flex;justify-content:space-between;color:var(--pale);font-size:15px;margin-top:4px}
.prog{height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;background:var(--red);border-radius:6px}
.prog.thin{height:5px;margin-top:6px}.prog.thin span{background:var(--pale)}

/* quick jump (phones) */
.jump{position:sticky;top:0;z-index:5;background:var(--mist);border-bottom:1px solid var(--line);display:none;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;min-height:38px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}

/* grid */
.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;
  grid-template-areas:"today today today today today today today today out out out out" "brief brief brief brief brief brief brief brief out out out out"
  "fol fol fol fol fol todo todo todo todo drive drive drive" "work work work work work work meal meal meal meal meal meal" "proj proj proj proj proj proj proj proj proj proj proj proj"}
#today{grid-area:today}#outlook{grid-area:out}#brief{grid-area:brief}#follow{grid-area:fol}#todo{grid-area:todo}#drive{grid-area:drive}#projects{grid-area:proj}#workout{grid-area:work}#meals{grid-area:meal}
@media (max-width:1180px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"today today" "out out" "brief brief" "fol todo" "drive drive" "work meal" "proj proj"}
  #outlook .days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .hero .in{grid-template-columns:1fr 1fr}.hero .mon{grid-column:1/-1}
}
@media (max-width:780px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"today" "out" "brief" "fol" "todo" "drive" "work" "meal" "proj"}
  #outlook .days{display:flex;flex-direction:column}
  .jump{display:flex}
  .hero .in{grid-template-columns:1fr;gap:10px}.hero .dow{font-size:38px}.clock{font-size:34px}
  .bar b{display:none}.bar{grid-template-columns:auto 1fr}
}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 60px -34px rgba(20,24,51,.4);min-width:0;scroll-margin-top:70px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd h2{font-size:30px;flex:1;min-width:0}
.hd .sub{color:var(--muted);font-size:15px}
.sec{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
.sec:first-child{margin-top:0}
.empty{color:var(--muted);font-size:16px;padding:10px 0}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--mist);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.red{background:#FDECEC;border-color:#F3C2C4;color:var(--red)}
.chip.green{background:#E7F4EC;border-color:#B9DEC6;color:var(--green)}
.chip.navy{background:#E9ECFA;border-color:var(--pale);color:var(--navy)}
.chip.amber{background:#FFF4E0;border-color:#F1D39C;color:var(--amber)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs.tk{gap:6px;margin-bottom:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center}.tabs.tk::-webkit-scrollbar{display:none}.tabs.tk button{min-height:34px;padding:0 10px;font-size:14px;flex:none}
.tabs.tk .gap{flex:1;min-width:4px}
.sech{display:flex;align-items:center;gap:8px}.sech .tabs{margin:0 0 0 auto;font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:600}.sech .gap{display:none}.tabs.tk button.tg{border-style:dashed}.tabs.tk button.tg[aria-pressed="true"]{border-style:solid;background:var(--ink);border-color:var(--ink)}
.tabs button .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:10px;background:var(--mist);color:var(--ink);font-size:12px;line-height:18px}
.tabs button[aria-pressed="true"] .n{background:rgba(255,255,255,.2);color:#fff}
.src{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:1px}
.more{width:100%;margin-top:6px;min-height:40px;border:1px dashed var(--line);border-radius:10px;background:none;font-weight:600;font-size:15px;color:var(--navy);cursor:pointer}
pre.code{background:#0F1430;color:#E6E9F7;border-radius:10px;padding:12px;font-size:12px;line-height:1.45;overflow:auto;max-height:220px;margin:0;white-space:pre}
.copyrow{display:flex;gap:8px;align-items:center}.copyrow input{flex:1;min-width:0;font-size:13px!important}

/* today */
.tcols{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
@media (max-width:900px){.tcols{grid-template-columns:1fr}}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.allday span{font-size:15px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--mist);border-left:4px solid var(--navy)}
.ev{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0}
.ev .tm{font-weight:600;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.ev .tm small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.ev .ti{font-weight:600;border-left:4px solid var(--c,var(--navy));padding-left:10px;overflow-wrap:anywhere}
.ev .ti small{display:block;color:var(--muted);font-weight:400;font-size:15px}
.ev.past{opacity:.5}
.ev .ti{cursor:pointer}.ev.rtn .ti{border-left-style:dashed;color:var(--muted)}.ev.rtn .ti small{display:none}
.rt{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.rt b{color:var(--ink)}.rt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--pale)}.rt[aria-pressed="true"] b{color:#fff}
.rtline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line)}.rtline button{background:none;border:0;color:var(--navy);font-weight:600;cursor:pointer;font-size:14px;padding:0}
.day li{cursor:pointer}
.ev.now .tm{color:var(--red)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--red);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.nowline::after{content:"";flex:1;height:2px;background:var(--red)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.task:first-of-type{border-top:0}
.task .nm{font-weight:600;overflow-wrap:anywhere}
.task .nm small{display:block;font-weight:400;color:var(--muted);font-size:15px}
.task.done .nm{text-decoration:line-through;opacity:.5}
.ck{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid #AAB1CC;border-radius:8px;margin:0;cursor:pointer;display:grid;place-content:center;background:#fff;flex:none}
.ck:checked{background:var(--green);border-color:var(--green)}
.ck:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.x{background:none;border:0;color:#9BA2BD;font-size:22px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--red);background:var(--mist)}
.go{font-size:14px;font-weight:600;white-space:nowrap;text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.go:hover{border-color:var(--navy)}

/* outlook */
.days{display:flex;flex-direction:column;gap:14px}
.day{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--mist)}
.day h3{font-size:24px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.day h3 small{font-family:var(--body);font-weight:500;text-transform:none;font-size:15px;color:var(--muted)}
.day .wxs{margin-left:auto;font-family:var(--body);font-weight:600;font-size:14px;text-transform:none;color:var(--muted)}
.day .hol2{margin-top:6px}
.day ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.day li{font-size:16px;display:grid;grid-template-columns:68px 1fr;gap:8px;line-height:1.3}
.day li b{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);padding-top:2px}
.day li span{border-left:3px solid var(--c,var(--navy));padding-left:8px;overflow-wrap:anywhere}
.day .cnt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* briefing */
.bi{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bi:first-of-type{border-top:0}
.bi .n{font-family:var(--display);font-weight:800;font-size:26px;color:var(--pale);line-height:1}
.bi b{display:block}
.bi p{margin:2px 0 0;color:var(--muted);font-size:16px}

/* follow-ups */
.pp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.pp:first-of-type{border-top:0}
.pp b{font-weight:600;overflow-wrap:anywhere}
.pp .meta{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.pp .go{grid-row:1/3;grid-column:2}

/* to-do */
.add{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px}
.add input{min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:17px}
.add input[type=date]{width:150px;font-size:15px}
@media (max-width:420px){.add{grid-template-columns:1fr auto}.add input[type=text]{grid-column:1/-1}.add input[type=date]{width:100%}}

/* daily drive */
.ring{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ring svg{flex:none}
.ring b{font-family:var(--display);font-size:40px;line-height:1;color:var(--navy)}
.ring span{display:block;color:var(--muted);font-size:15px}
.drv{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.drv:first-of-type{border-top:0}
.drv div{font-weight:600;line-height:1.25}
.drv small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.wk{display:flex;gap:5px;margin:10px 0 2px}
.wk i{flex:1;text-align:center;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.wk i::before{content:"";display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:3px}
.wk i.on::before{background:var(--green)}
.wk i.part::before{background:#B9DEC6}
.wk i.today{color:var(--ink)}
.ctr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ctr b{font-variant-numeric:tabular-nums}
.ctr .bt{display:flex;gap:4px}
.ctr .bt button{min-width:40px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:15px}
.ctr .bar2{grid-column:1/-1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:-2px}
.ctr .bar2 span{display:block;height:100%;background:var(--navy)}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pj{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-left:5px solid var(--a,var(--navy));border-radius:12px;background:#fff;cursor:pointer;width:100%}
.pj:hover{border-color:var(--navy)}
.pj .t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.pj b{font-size:18px;line-height:1.25}
.pj p{margin:0;color:var(--muted);font-size:15px;line-height:1.35}
.pj .m{display:flex;gap:6px;flex-wrap:wrap}
.pj.done{opacity:.55}
.pnew{display:flex;align-items:center;justify-content:center;min-height:90px;border:2px dashed var(--line);border-radius:12px;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:17px}
.pnew:hover{border-color:var(--navy);color:var(--navy)}

/* workout + meals */
.big{font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:.95;color:var(--navy)}
.big small{display:block;font-family:var(--body);text-transform:none;font-weight:500;font-size:16px;color:var(--muted);margin-top:4px}
.ex{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:17px}
.ex:first-of-type{border-top:0}
.ex span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex.ok b{text-decoration:line-through;opacity:.55}
.inline{display:flex;gap:10px;align-items:center;padding:12px 0 0;margin-top:10px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.meal{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.meal:first-of-type{border-top:0}
.meal div{line-height:1.3}
.meal small{display:block;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--muted)}
.meal.ok div{opacity:.55}
.water{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.water button{width:34px;height:40px;border-radius:6px 6px 10px 10px;border:2px solid #9DB4E8;background:#fff;cursor:pointer;padding:0}
.water button.on{background:#5C86E0;border-color:#5C86E0}
.targets{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 60px rgba(10,14,40,.4);color:var(--ink)}
dialog::backdrop{background:rgba(20,24,51,.6)}
.dl{padding:22px;display:flex;flex-direction:column;gap:14px}
.dl h2{font-size:32px;padding-right:40px}
.dl .close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.dl label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.dl input,.dl select,.dl textarea{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:17px;background:#fff;font-weight:400}
.dl textarea{padding:10px 12px;min-height:90px;resize:vertical}
.dl .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dl .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.lift{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lift .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lift .top b{font-size:19px}
.lift .cue{color:var(--muted);font-size:15px;margin:0}
.lift .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lift .sets{display:flex;gap:6px}
.lift .sets button{min-width:46px;min-height:42px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.lift .sets button.on{background:var(--green);border-color:var(--green);color:#fff}
.lift input{width:110px;min-height:42px}
.lift .hint{font-size:14px;color:var(--muted)}
.mtab{width:100%;border-collapse:collapse;font-size:15px}
.mtab th,.mtab td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.mtab th{font-family:var(--display);text-transform:uppercase;font-size:16px;white-space:nowrap}
.mtab tr.today td,.mtab tr.today th{background:#E9ECFA}
.cal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cal i{width:14px;height:14px;border-radius:4px;flex:none}
.cal div{flex:1;min-width:0}
.cal small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.help{font-size:15px;color:var(--muted);background:var(--mist);border-radius:10px;padding:12px 14px;margin:0}
.help ol{margin:6px 0 0;padding-left:20px}

  function dayKeyOf(iso){if(!iso)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(iso))return iso;return ymd(new Date(iso));}
  // routine = calendars marked routine in Settings (Work Schedule by default) + event names marked routine
  function quiet(){return (S.data&&S.data.settings.quiet)||[];}
  function normT(s){return String(s||'').trim().toLowerCase();}
  function isRoutine(e){return !!e.calRoutine||quiet().indexOf(normT(e.title))>=0;}
  function bucket(day){
    var f=S.data&&S.data.fub||{},ds=fromYmd(day).getTime(),de=addDays(fromYmd(day),1).getTime();
    var ev=[];
    (f.appts||[]).forEach(function(a){var s=Date.parse(a.start),e=Date.parse(a.end||a.start);
      if(a.allDay?dayKeyOf(a.start)===day:(s<de&&Math.max(e,s+1)>ds))ev.push({title:a.title,sub:[a.location,(a.who||[]).map(function(w){return w.name;}).join(', ')].filter(Boolean).join(' · '),start:s,end:e,allDay:a.allDay,c:'#D7141E',src:'FUB',person:(a.who||[])[0]});});
    S.cal.forEach(function(x){if(x.start<de&&Math.max(x.end,x.start+1)>ds){
      if(ev.some(function(y){return !y.allDay&&Math.abs(y.start-x.start)<6e4&&y.title.toLowerCase()===String(x.title).toLowerCase();}))return;
      ev.push({title:x.title,sub:x.loc,start:x.start,end:x.end,allDay:x.allDay,c:x.color,src:x.cal,calRoutine:x.routine});}});
    ev.sort(function(a,b){return (b.allDay-a.allDay)||(a.start-b.start);});
    var tasks=(f.tasks||[]).filter(function(t){return dayKeyOf(t.due)===day;}).sort(function(a,b){return String(a.due).localeCompare(String(b.due));});
    var todos=(S.data?S.data.todos:[]).filter(function(t){return t.due===day;});
    ev.forEach(function(e){e.rtn=isRoutine(e);});
    var rn=ev.filter(function(e){return e.rtn;}).length;
    if(!S.routine)ev=ev.filter(function(e){return !e.rtn;});
    return {ev:ev,tasks:tasks,todos:todos,routineN:rn};

  // Today on: due today (+ overdue if Overdue on). Today off: everything (overdue only if Overdue on).
  function pick(L,tOn,oOn){return L.filter(function(x){return tOn?(x.day===S.today||(oOn&&x.late)):(oOn||!x.late);});}

  function hasTime(iso){if(!iso||/^\d{4}-\d{2}-\d{2}$/.test(iso))return false;var d=new Date(iso);return d.getHours()+d.getMinutes()>0;}
  function allTasks(){
    var f=S.data.fub||{},L=[],seen={};
    (f.overdue||[]).concat(f.tasks||[]).forEach(function(t){if(seen[t.id])return;seen[t.id]=1;
      L.push({src:'fub',id:t.id,title:t.name||t.type,who:t.who,type:t.type&&t.type!==t.name?t.type:'',day:dayKeyOf(t.due),time:hasTime(t.due)?Date.parse(t.due):null,person:t.person});});

    var C=2*Math.PI*30,pct=n/tot;
    var wk='',start=addDays(fromYmd(S.today),-6);
    for(var i=0;i<7;i++){var day=ymd(addDays(start,i)),v=(S.data.week[day]||{}).drive||[];if(day===S.today)v=on;
      wk+='<i class="'+(v.length>=tot?'on':v.length?'part':'')+(day===S.today?' today':'')+'">'+DOWS[addDays(start,i).getDay()].charAt(0)+'</i>';}

    $('driveBody').innerHTML='<div class="ring"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="#DCE0EC" stroke-width="8"/><circle cx="36" cy="36" r="30" fill="none" stroke="'+(n>=tot?'#1B7A3E':'#1D2870')+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*pct)+' '+C+'" transform="rotate(-90 36 36)"/><text x="36" y="42" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="20" fill="#141833">'+n+'/'+tot+'</text></svg>'
      +'<div><b>'+st+'</b><span>day streak'+(n>=tot?' · today done':'')+'</span></div></div>'
      +DRIVE.map(function(d,i){return '<label class="drv"><input class="ck" type="checkbox" data-d="'+i+'"'+(on.indexOf(i)>=0?' checked':'')+'><div>'+esc(d[0])+'<small>'+esc(d[1])+'</small></div></label>';}).join('')
      +'<div class="wk">'+wk+'</div>'

      var i=+c.dataset.d,a=(S.data.logs.drive||[]).filter(function(x){return x!==i;});if(c.checked)a.push(i);a.sort();
      var was=(S.data.logs.drive||[]).length>=tot;

        +'<div class="sec">Google calendars</div><div id="gcS"><p class="empty">Loading…</p></div>'
        +(st.calendars.length?'<p class="muted" style="font-size:14px;margin:8px 0 0">Older calendar links (busy only). Remove them:</p>'+st.calendars.map(function(c,i){return '<div class="cal"><i style="background:'+esc(c.color)+'"></i><div><b>'+esc(c.name)+'</b><small>'+esc(c.hint)+'</small></div><button class="x" type="button" data-rm="'+i+'" aria-label="Remove">×</button></div>';}).join(''):'')
        +'<div class="sec">Google Tasks</div><div id="gtS"><p class="empty">Loading…</p></div>'
        +'<div class="sec">Reminders (iPhone)</div><div id="remS"><p class="empty">Loading…</p></div>'
        +'<div class="sec">Follow-up tabs (Smart Lists, up to 4)</div><div id="sl"><p class="empty">Loading…</p></div>'
        +'<div class="sec">This device</div><button class="btn ghost sm" type="button" id="lock">Lock (forget PIN)</button>');
      [].forEach.call(document.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){if(!confirm('Remove this calendar?'))return;post('settings',{removeCal:+b.dataset.rm}).then(function(j){st=S.data.settings=j.settings;render();loadCals();}).catch(fail);};});
      gcalSettings();
      $('lock').onclick=function(){SM.store('sm_oh_pin','');location.reload();};
      getJ('sync-info').then(function(si){syncSettings(si);}).catch(function(){$('gtS').innerHTML=$('remS').innerHTML='<p class="err">Could not load.</p>';});
      getJ('smartlists').then(function(j){
        j.lists.forEach(function(l){S.lists[l.id]=l.name;});SM.store('hq_lists',S.lists);
        $('sl').innerHTML=j.lists.map(function(l){return '<label class="drv"><input class="ck" type="checkbox" value="'+l.id+'"'+(st.lists.indexOf(l.id)>=0?' checked':'')+'><div>'+esc(l.name)+'</div></label>';}).join('');
        [].forEach.call($('sl').querySelectorAll('input'),function(c){c.onchange=function(){
          var ids=[].map.call($('sl').querySelectorAll('input:checked'),function(x){return +x.value;});
          if(ids.length>4){c.checked=false;toast('Up to 4 tabs');return;}if(!ids.length){c.checked=true;return;}
          post('settings',{lists:ids}).then(function(j2){st=S.data.settings=j2.settings;followTabs();people();}).catch(fail);};});
      }).catch(function(){$('sl').innerHTML='<p class="err">Could not load Smart Lists.</p>';});
    }
    render();
  }

  function copyRow(id,val){return '<div class="copyrow"><input id="'+id+'" readonly value="'+esc(val)+'"><button type="button" class="btn ghost sm" data-copy="'+id+'">Copy</button></div>';}
  function bindCopy(el){[].forEach.call(el.querySelectorAll('[data-copy]'),function(b){b.onclick=function(){var i=$(b.dataset.copy);i.select();
    (navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(function(){toast('Copied');},function(){document.execCommand('copy');toast('Copied');});};});}
  function gScript(tok){return `// SoldMike HQ: lets soldmike.com/hq/ read your Google Tasks and tick them done.
const TOKEN = '${tok}';
function doGet(e) {
  const p = e.parameter || {};
  if (p.t !== TOKEN) return out({ error: 'no' });
  if (p.a === 'done') {
    Tasks.Tasks.patch(p.done === '1' ? { status: 'completed' } : { status: 'needsAction', completed: null }, p.list, p.id);
    return out({ ok: true });
  }
  const items = [];
  (Tasks.Tasklists.list({ maxResults: 100 }).items || []).forEach(function (l) {
    let page;
    do {
      const r = Tasks.Tasks.list(l.id, { showCompleted: false, showHidden: false, maxResults: 100, pageToken: page });
      (r.items || []).forEach(function (t) {
        if (t.title) items.push({ id: t.id, list: l.id, listName: l.title, title: t.title, due: t.due || null });
      });
      page = r.nextPageToken;
    } while (page);
  });
  return out({ items: items });
}
function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}`;}
  function syncSettings(si){
    var g=$('gtS'),r=$('remS');if(!g)return;
    g.innerHTML=(si.gtasks?'<p style="margin:0 0 8px"><span class="chip green">Connected</span></p>':'')
      +'<div class="help">'+(si.gtasks?'To reconnect, repeat these steps.':'One-time setup on a computer (about 5 minutes):')+'<ol><li>Go to <b>script.google.com</b> (signed in as broker@) → <b>New project</b>. Name it <b>SoldMike HQ Tasks</b>.</li>'
      +'<li>Delete what\'s there and paste the code below (Copy button).</li><li>Left side: <b>Services +</b> → <b>Google Tasks API</b> → Add.</li>'
      +'<li><b>Deploy → New deployment</b> → gear → <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Deploy, then allow access.</li><li>Copy the <b>Web app URL</b> and paste it below.</li></ol></div>'
      +'<pre class="code" id="gcode"></pre><button type="button" class="btn ghost sm" id="gcopy">Copy code</button>'
      +'<form id="gtF" class="copyrow" style="margin-top:10px"><input name="u" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" style="min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px"><button class="btn navy sm" type="submit">Save</button></form>';
    $('gcode').textContent=gScript(si.token);
    $('gcopy').onclick=function(){var c=gScript(si.token);(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(function(){toast('Code copied');},function(){toast('Select the code and copy it');});};
    $('gtF').onsubmit=function(e){e.preventDefault();post('settings',{gtasksUrl:this.u.value}).then(function(){toast('Google Tasks saved');S.data.settings.gtasks=true;loadExtra();getJ('sync-info').then(syncSettings);}).catch(fail);};
    var base=SM.api+'/sync/reminders';
    r.innerHTML=(S.rem&&S.rem.at?'<p style="margin:0 0 8px"><span class="chip green">Last update '+tm(S.rem.at)+(ymd(new Date(S.rem.at))===S.today?'':' · '+DOWS[new Date(S.rem.at).getDay()])+'</span></p>':'')
      +'<p class="help" style="margin-bottom:8px">Your iPhone Shortcut uses these two addresses. Open this page on your iPhone to copy them. Keep them private.</p>'
      +'<label style="font-weight:600;font-size:14px">1 · Done list (Get Contents of URL)</label>'+copyRow('remDone',base+'/done?f=text&t='+si.token)
      +'<label style="font-weight:600;font-size:14px;margin-top:8px;display:block">2 · Send reminders (POST)</label>'+copyRow('remSync',base+'?t='+si.token);
    bindCopy(r);
  }

  // ---------- load ----------
  var GDEF=/^\d+\.|Broker Sch|Work Schedule|Kleinburg/i, GSKIP=/Follow Up Boss/i;
  function gEvents(){
    var from=fromYmd(S.days[0]).toISOString(),to=addDays(fromYmd(S.days[0]),4).toISOString();
    return getJ('gevents?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)).then(function(j){
      if(j.cals.length)return j;
      // first time: pick the work calendars (names starting with a number, Broker / Work Schedule), never the FUB ones
      return getJ('gcals').then(function(g){
        if(g.setup||g.selected)return j;
        var sel=g.cals.filter(function(c){return GDEF.test(c.name)&&!GSKIP.test(c.name);}).map(function(c){return {id:c.id,name:c.name.trim(),color:c.color,routine:/Work Schedule/i.test(c.name)};});
        return sel.length?post('settings',{gcalSel:sel}).then(gEvents):j;
      });
    }).then(function(j){var by={};j.cals.forEach(function(c){by[c.id]=c;});
      return j.events.map(function(e){var c=by[e.cal]||{},all=e.allDay;
        var st=all?fromYmd(e.start).getTime():Date.parse(e.start),en=all?fromYmd(e.end).getTime():Date.parse(e.end);
        return {title:e.title||'(no title)',loc:e.loc||'',start:st,end:en,allDay:all,color:c.color||'#1D2870',cal:c.name||'Google',routine:c.routine!=null?!!c.routine:/Work Schedule/i.test(c.name||'')};});
    }).catch(function(e){if(e!=='pin')toast('Could not read Google Calendar');return [];});
  }
  function loadCals(){
    var cals=S.data.settings.calendars,ws=fromYmd(S.days[0]).getTime(),we=addDays(fromYmd(S.days[0]),4).getTime();
    var ics=cals.map(function(c,i){return api('cal?i='+i).then(function(r){return r.text();}).then(function(t){
      return calEvents(t,ws,we).map(function(e){e.color=c.color;e.cal=c.name;return e;});}).catch(function(){return [];});});
    return Promise.all(ics.concat([gEvents()])).then(function(all){S.cal=[].concat.apply([],all);today();outlook();});
  }
  function gcalSettings(){
    var el=$('gcS');if(!el)return;
    getJ('gcals').then(function(g){
      if(g.setup){el.innerHTML='<p class="empty">Connect Google Tasks below first; calendars use the same Google script.</p>';return;}
      var sel={};(g.selected||[]).forEach(function(c){sel[c.id]=c;});
      function rt(c){var s=sel[c.id];return s?(s.routine!=null?!!s.routine:/Work Schedule/i.test(c.name)):false;}
      el.innerHTML='<p class="muted" style="font-size:14px;margin:0 0 4px">Tick the calendars to show. <b>Routine</b> calendars fold away when Routine is Off. Leave the Follow Up Boss ones off (those come straight from FUB).</p>'
        +g.cals.map(function(c){return '<div class="drv" style="align-items:center"><input class="ck" type="checkbox" value="'+esc(c.id)+'"'+(sel[c.id]?' checked':'')+' aria-label="Show '+esc(c.name)+'"><div style="flex:1"><span class="src" style="background:'+esc(c.color)+'"></span>'+esc(c.name)+'</div>'
          +'<button type="button" class="rt" data-r="'+esc(c.id)+'" aria-pressed="'+rt(c)+'"'+(sel[c.id]?'':' hidden')+'>Routine</button></div>';}).join('');
      function save(){
        var s2=g.cals.filter(function(c){return el.querySelector('input[value="'+CSS.escape(c.id)+'"]').checked;})
          .map(function(c){return {id:c.id,name:c.name.trim(),color:c.color,routine:el.querySelector('[data-r="'+CSS.escape(c.id)+'"]').getAttribute('aria-pressed')==='true'};});
        sel={};s2.forEach(function(c){sel[c.id]=c;});
        post('settings',{gcalSel:s2}).then(function(){loadCals();}).catch(fail);
      }
      [].forEach.call(el.querySelectorAll('input'),function(x){x.onchange=function(){el.querySelector('[data-r="'+CSS.escape(x.value)+'"]').hidden=!x.checked;save();};});
      [].forEach.call(el.querySelectorAll('[data-r]'),function(x){x.onclick=function(){x.setAttribute('aria-pressed',x.getAttribute('aria-pressed')!=='true');save();};});
    }).catch(function(){el.innerHTML='<p class="err">Could not load your calendars.</p>';});
  }
  function loadExtra(){
    getJ('gtasks').then(function(j){S.gt=j;}).catch(function(e){if(e==='pin')return;S.gt={error:'Google Tasks: '+e};})
      .then(function(){return getJ('reminders');}).then(function(j){if(j)S.rem=j;}).catch(function(){})
      .then(function(){if(S.data){today();outlook();fubPanel();}});
  }
  function load(){
    var now=new Date();S.today=ymd(now);S.days=[0,1,2,3].map(function(i){return ymd(addDays(now,i));});
    header();
    var from=fromYmd(S.today).toISOString(),to=addDays(fromYmd(S.today),4).toISOString();
    $('refresh').classList.add('spin');
    return getJ('day?today='+S.today+'&from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+'&drive='+DRIVE.length).then(function(d){
      S.data=d;S.loadedAt=Date.now();
      today();outlook();brief();renderTodos();drive();workout();meals();followTabs();people();
      loadCals();loadExtra();
      if(!S.lists[S.data.settings.lists[0]])getJ('smartlists').then(function(j){j.lists.forEach(function(l){S.lists[l.id]=l.name;});SM.store('hq_lists',S.lists);followTabs();}).catch(function(){});
      return getJ('items').then(function(j){
        if(j.items.length){S.projects=j.items;projects();return;}
        return post('seed',{items:SEED}).then(function(){return getJ('items');}).then(function(j2){S.projects=j2.items;projects();});
      });
    }).catch(function(e){if(e==='pin')return askPin().then(load);$('sched').innerHTML='<p class="err">Could not load ('+esc(e)+'). Check the connection and refresh.</p>';})
      .then(function(){$('refresh').classList.remove('spin');});
  }
  $('refresh').onclick=function(){load();weather();};
  setInterval(function(){header();if(S.data&&new Date().getSeconds()<15)today();},15000);
  setInterval(function(){if(!document.hidden){load();}},5*60000);
  setInterval(weather,30*60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&(Date.now()-S.loadedAt>120000||ymd(new Date())!==S.today))load();});
  weather();
  if(!pin())askPin().then(load);else load();
})();
</script>
</body>
