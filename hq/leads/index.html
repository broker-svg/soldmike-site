<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leads (mockup) | SoldMike HQ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D2870">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* HQ › Leads MOCKUP (Nov 13, 2026). Made-up leads only: no real lead data, no API calls.
   Layout follows a CRM "People list + person page" workflow, in SoldMike's own look.
   Wiring plan: 2nd Brain/Systems/HQ Leads.md */
:root{--navy:#1D2870;--navy2:#26338A;--ink:#141833;--red:#D7141E;--mist:#F7F8FB;--line:#DCE0EC;--muted:#545B78;--pale:#C9D0F2;--green:#1B7A3E;--amber:#9A5B00;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
a{color:var(--navy)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.navy{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--mist);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.red{background:#FDECEC;border-color:#F3C2C4;color:var(--red)}
.chip.green{background:#E7F4EC;border-color:#B9DEC6;color:var(--green)}
.chip.navy{background:#E9ECFA;border-color:var(--pale);color:var(--navy)}
.chip.amber{background:#FFF4E0;border-color:#F1D39C;color:var(--amber)}

/* top bar + HQ tabs (same as HQ) */
.bar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.bar>:last-child{justify-self:end}
.bar img{height:42px;width:auto;display:block}
.bar b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.bar a.lnk{border:1px solid #4A5592;color:#fff;border-radius:8px;min-height:40px;padding:0 14px;font-size:15px;display:inline-flex;align-items:center;text-decoration:none}
.dtabs{background:var(--navy2);border-top:1px solid #3A4799}
.dtabs nav{max-width:1440px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.dtabs nav::-webkit-scrollbar{display:none}
.dtabs a{flex:none;display:inline-flex;align-items:center;min-height:52px;padding:0 16px;color:var(--pale);text-decoration:none;font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.04em;border-bottom:4px solid transparent}
.dtabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}
.mock{background:#FFF4E0;border-bottom:1px solid #F1D39C;color:var(--amber);font-size:15px;font-weight:600;padding:8px 16px;text-align:center}
@media (max-width:780px){.bar b{display:none}.bar{grid-template-columns:auto 1fr}}

.wrap{max-width:1440px;margin:0 auto;padding:18px 16px 60px}

/* ===== list ===== */
.lhd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lhd h1{font-size:40px;flex:1}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lhd h1{font-size:34px}}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;min-height:52px;border:1px solid var(--line);border-radius:10px;padding:0 16px;background:#fff;font-size:18px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters select,.fbtn{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.count{font-size:15px;color:var(--muted);margin:0 0 8px}

/* table (desktop) */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
.tbl th{font-family:var(--display);text-transform:uppercase;font-size:15px;letter-spacing:.03em;text-align:left;color:var(--muted);padding:10px 12px;background:var(--mist);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#F1F3FB}
.tbl .nm b{display:block;font-size:16px}
.tbl .nm small{color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--pale);color:var(--navy);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.who{display:flex;gap:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.on{background:var(--green)}
/* cards (phone) */
.cards{display:none;flex-direction:column;gap:10px}
.lc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;width:100%;text-align:left;cursor:pointer}
.lc .av{grid-row:span 2}
.lc b{font-size:18px}
.lc .when{color:var(--muted);font-size:14px;white-space:nowrap}
.lc .last{grid-column:2/-1;color:var(--muted);font-size:15px}
.lc .chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
@media (max-width:900px){.tbl{display:none}.cards{display:flex}}

/* ===== person page ===== */
.back{background:none;border:0;color:var(--navy);font-weight:600;font-size:16px;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.phd{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:16px}
.phd .av{width:64px;height:64px;font-size:24px}
.phd .id{flex:1;min-width:220px}
.phd h1{font-size:38px}
.phd .sub{color:var(--muted);font-size:15px;margin-top:4px}
.phd .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card+.card{margin-top:16px}
.card h3{font-size:22px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .n{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);text-transform:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.ptabs{display:none;gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:3;background:var(--mist);padding:8px 0}
.ptabs button{flex:1;min-height:42px;border-radius:21px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.ptabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
@media (max-width:1180px){.cols{grid-template-columns:280px minmax(0,1fr)}.cols .right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}.cols .right .card+.card{margin-top:0}}
@media (max-width:780px){
  .cols{grid-template-columns:minmax(0,1fr)}.cols .right{display:block}.cols .right .card+.card{margin-top:16px}
  .ptabs{display:flex}
  .cols>[data-pane]{display:none}.cols>[data-pane].show{display:block}
  .phd h1{font-size:32px}.acts{width:100%}.acts .btn{flex:1 1 40%}
}
/* timeline */
.tfil{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.tfil::-webkit-scrollbar{display:none}
.tfil button{flex:none;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.tfil button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.note{display:flex;gap:8px;margin-bottom:10px}
.note input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--mist);border:1px solid var(--line)}
.ic.view{background:#E9ECFA;border-color:var(--pale)}
.ic.save{background:#FDECEC;border-color:#F3C2C4}
.ic.inquiry{background:#FFF4E0;border-color:#F1D39C}
.ic.openhouse{background:#E7F4EC;border-color:#B9DEC6}
.ic.alert{background:#EEF0F5}
.tl b{font-size:15px}
.tl .what{font-size:15px}
.tl .t{color:var(--muted);font-size:13px}
.tl .q{margin-top:4px;padding:8px 10px;background:var(--mist);border-radius:8px;font-size:15px}
/* saved searches + homes */
.ss{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ss:first-of-type{border-top:0}
.ss b{font-size:15px}
.ss small{display:block;color:var(--muted);font-size:13px}
.tog{min-height:38px;min-width:58px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;flex:none;font-size:14px}
.tog[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.home{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.home:first-of-type{border-top:0}
.ph{width:64px;height:48px;border-radius:8px;background:linear-gradient(135deg,#C9D0F2,#8E9AD6)}
.home small{display:block;color:var(--muted);font-size:13px}
.vow{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--mist);border:1px solid var(--line);font-size:15px}
.vow.on{background:#E7F4EC;border-color:#B9DEC6}
.foot{font-size:14px;color:var(--muted);margin-top:18px}
/* ===== round 2 (Nov 13): width switch, tasks, notes, waiting clock, viewed strip, search homes + map ===== */
html.wide .wrap,html.wide .dtabs nav{max-width:none}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wbtn{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer;flex:none}
@media (max-width:1180px){.wbtn{display:none}}
.stat.act b{color:var(--red)}
.pic{display:block;border-radius:10px;overflow:hidden;background:var(--pale);flex:none}
.pic svg{display:block;width:100%;height:100%}
.home .pic{width:132px;height:92px}
/* tasks */
.task{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.task:first-of-type{border-top:0}
.tk{width:30px;height:30px;border-radius:8px;border:2px solid #AEB5CF;background:#fff;cursor:pointer;color:#fff;font-weight:700;font-size:16px;line-height:1;padding:0}
.tk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.task b{font-size:15px;display:block}
.task small{color:var(--muted);font-size:13px}
.task.done b{text-decoration:line-through;color:var(--muted);font-weight:500}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
/* notes */
.notes textarea{display:block;width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;resize:vertical}
.notes .btn{margin-top:8px}
.nt{padding:10px 12px;border-radius:10px;background:#FFFBEA;border:1px solid #F1E2A6;margin-top:8px;font-size:15px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.nt.pin{border-color:#D9A91A;border-width:2px}
.nt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pinb{flex:none;min-height:34px;padding:0 10px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
/* saved search: tap to open, new search, templates */
.slink{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--navy);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.newbox{margin-top:10px;padding:12px;border-radius:12px;background:var(--mist);border:1px solid var(--line);font-size:15px}
.newbox input[type=text]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:#fff}
.newbox .tp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.newbox .tp button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--pale);background:#E9ECFA;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.newbox label{display:flex;align-items:center;gap:8px;margin:8px 0}
.newbox label input{width:20px;height:20px}
.ov{position:fixed;inset:0;background:rgba(20,24,51,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:1080px;max-height:92vh;overflow:auto}
.shd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.shd h3{font-size:26px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.bh{display:grid;grid-template-columns:auto 200px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:15px}
.bh:first-child{border-top:0}
.bh .pic{width:200px;height:134px}
.bh small{display:block;color:var(--muted);font-size:14px}
.pinno{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.map{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:0}
.map svg{display:block;width:100%;height:auto}
.map small{display:block;padding:6px 10px;color:var(--muted);font-size:13px}
@media (max-width:780px){.sgrid{grid-template-columns:minmax(0,1fr)}.map{position:static;order:-1}.bh{grid-template-columns:auto 132px 1fr}.bh .pic{width:132px;height:92px}}
/* viewed homes strip (rolls along the bottom on desktop, swipes on phone) */
.strip{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:stretch;border-top:3px solid var(--red)}
.strip .lab{flex:none;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 16px;background:var(--navy);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:21px;line-height:1;z-index:1}
.strip .lab small{font-family:var(--body);font-weight:500;text-transform:none;font-size:13px;color:var(--pale)}
.roll{overflow:hidden;flex:1;min-width:0}
.rtrack{display:flex;width:max-content;padding:10px 0;animation:roll 70s linear infinite}
.roll:hover .rtrack,.roll:focus-within .rtrack{animation-play-state:paused}
@keyframes roll{to{transform:translateX(-50%)}}
.vc{flex:none;display:flex;gap:10px;align-items:center;background:#232A52;border-radius:12px;padding:6px 16px 6px 6px;margin-right:12px;font-size:14px;color:#fff;text-decoration:none}
.vc .pic{width:150px;height:100px}
.vc b{display:block;font-size:15px;white-space:nowrap}
.vc small{display:block;color:var(--pale);white-space:nowrap}
.vc .chip{margin-bottom:3px}
body.hasstrip .wrap{padding-bottom:170px}
body.hasstrip .toast{bottom:150px}
@media (max-width:780px){
  .strip{position:static;flex-direction:column;border-radius:14px;border-top:0;margin-bottom:12px;overflow:hidden}
  .strip .lab{flex-direction:row;align-items:baseline;justify-content:space-between;padding:10px 14px 0;background:none}
  .roll{overflow-x:auto;scrollbar-width:none}.roll::-webkit-scrollbar{display:none}
  .rtrack{animation:none;padding:10px 0 12px 12px}.vc.dup{display:none}
  .vc{flex-direction:column;align-items:flex-start;padding:6px 6px 10px}.vc .pic{width:210px;height:140px}.vc>div{padding:0 6px}
  body.hasstrip .wrap{padding-bottom:60px}body.hasstrip .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){.rtrack{animation:none}.roll{overflow-x:auto}.vc.dup{display:none}}
/* website sign-in (soldmike.com/leads/ way in) */
html.site .dtabs{display:none}
.signin{max-width:420px;margin:24px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 24px 60px -30px rgba(20,24,51,.45);display:flex;flex-direction:column;gap:12px}
.signin h1{font-size:38px}
.signin label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.signin input[type=email],.signin input[type=password]{min-height:52px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px}
.signin .keep{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.signin .keep input{width:22px;height:22px}
.signin .btn{width:100%;min-height:52px;font-size:18px}
.ways{max-width:420px;margin:16px auto 0;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:10;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="bar">
  <a href="/hq/" aria-label="HQ"><img src="/logo-soldmike-white.png" alt="SoldMike"></a>
  <b>Leads</b>
  <a class="lnk" href="/hq/" id="barLnk">Back to HQ</a>
</div>
<div class="dtabs"><nav aria-label="Dashboards"><a href="/hq/tasks/">Tasks</a><a href="/hq/">HQ</a><a href="/hq/agents/#realestate">Real Estate</a><a href="/hq/agents/#marketing">Marketing</a><a href="/hq/agents/#toolkit">Toolkit</a><a href="/hq/agents/#personal">Personal</a><a href="/hq/agents/#financial">Financial</a><a href="/hq/agents/#tpm">TPM</a><a href="/open-house/">Open House</a><a href="/hq/leads/" aria-current="page">Leads</a><a href="/hq/ads/" target="_blank" rel="noopener">Ads</a><a href="/vow/realview" target="_blank" rel="noopener">RealView</a></nav></div>
<div class="mock">MOCKUP round 2 · made-up people, homes and photos · buttons don't change anything · <a href="?from=site#signin" id="mockWay" style="color:inherit">See the website sign-in</a></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  // ---------- made-up data (nothing here is a real person or listing) ----------
  var NOW=Date.now(), H=36e5, D=864e5;
  function at(ms){return new Date(NOW-ms).toISOString();}

      +'<dt>Price range</dt><dd>'+(l.price?esc(l.price):'<span class="muted">Not known</span>')+'</dd>'
      +'<dt>Areas</dt><dd>'+(l.areas?esc(l.areas):'<span class="muted">Not known</span>')+'</dd>'
      +'<dt>First seen</dt><dd>'+esc(ago(l.created))+'</dd>'
      +'<dt>Last active</dt><dd>'+esc(ago(l.seen))+'</dd>'
      +'<dt>Emails</dt><dd>'+(l.alerts?'<b style="color:var(--green)">New-listing alerts on</b>':'<span class="muted">Alerts off</span>')+'</dd>'
      +'<dt>VOW</dt><dd>'+(l.vow?'<b style="color:var(--green)">Member</b> · can see sold prices':'<span class="muted">Not a member</span>')+'</dd></dl>'
      +'<a class="btn navy" href="#" data-fub style="width:100%;margin-top:14px">Open in Follow Up Boss</a><p class="muted" style="margin:10px 0 0;font-size:14px">Notes, tasks and activity here are also written to Follow Up Boss.</p></div>';
    var mid='<div class="card notes"><h3>Notes <span class="n" id="notesN"></span></h3><textarea id="noteIn" placeholder="Type a note about this lead"></textarea><button class="btn navy" type="button" id="noteBtn">Save note</button><div id="notesBox"></div></div>'
      +'<div class="card"><h3>Activity <span class="n">what they did on the site</span></h3>'
      +'<div class="tfil" id="tfil">'+[['all','All'],['view','Viewed'],['save','Saved'],['inquiry','Asked'],['openhouse','Open house'],['alert','Alerts'],['note','Notes']].map(function(x){return '<button type="button" data-k="'+x[0]+'" aria-pressed="'+(x[0]==='all')+'">'+x[1]+'</button>';}).join('')+'</div>'
      +'<ul class="tl" id="tl"></ul></div>';
    var right='<div class="right" data-pane="homes"><div class="card" id="cTasks"></div><div class="card" id="cSearch"></div>'
      +'<div class="card"><h3>Saved homes <span class="n">'+l.homes.length+'</span></h3>'+(l.homes.length?l.homes.map(function(i){var h=home(i);
        return '<div class="home"><span class="pic">'+pic(i)+'</span><div><b>'+esc(h.addr)+'</b><small>'+homeLine(h)+'</small><small>MLS® '+esc(h.mls)+'</small></div></div>';
      }).join(''):'<p class="muted" style="margin:0;font-size:15px">No saved homes.</p>')+'</div></div>';
    function vcard(v,n,dup){var h=home(v.i);return '<a class="vc'+(dup?' dup':'')+'" href="#" data-home'+(dup?' tabindex="-1" aria-hidden="true"':'')+'><span class="pic">'+pic(v.i)+'</span><div>'+(n===0?'<span class="chip red">Newest</span>':'')+'<b>'+esc(h.addr)+'</b><small>'+homeLine(h)+'</small><small>'+(v.k==='save'?'♥ Saved ':v.k==='inquiry'?'? Asked ':'👁 Viewed ')+esc(ago(v.ms))+'</small></div></a>';}
    var strip=vh.length?'<div class="strip" id="strip"><div class="lab">Viewed homes<small>'+vh.length+' homes · newest first</small></div><div class="roll"><div class="rtrack">'+vh.map(function(v,n){return vcard(v,n,0);}).join('')+vh.map(function(v,n){return vcard(v,n,1);}).join('')+'</div></div></div>':'';
    document.body.classList.toggle('hasstrip',!!vh.length);
    app.innerHTML='<div class="toprow"><button class="back" type="button" id="back">← All leads</button>'+wideBtn()+'</div>'
      +'<div class="phd"><span class="av">'+ini(l)+'</span><div class="id"><h1>'+esc(nm(l))+'</h1><div class="sub">'+esc(l.src)+' · last active '+esc(ago(l.seen))+'</div><div class="tags"><span id="hdWait"></span>'+stageChip(l.stage)+(l.vow?'<span class="chip green">VOW member</span>':'')+'<span class="chip'+(l.alerts?' green':'')+'">Alerts '+(l.alerts?'on':'off')+'</span></div></div>'
      +'<div class="acts">'+(l.phone?'<a class="btn ghost" href="tel:'+esc(l.phone)+'">Call</a><a class="btn ghost" href="sms:'+esc(l.phone)+'">Text</a>':'')+'<a class="btn ghost" href="#" data-mail>Email</a><a class="btn navy" href="#" data-fub>Open in FUB</a></div></div>'
      +strip
      +'<div class="ptabs" id="ptabs"><button type="button" data-p="act" aria-pressed="true">Activity</button><button type="button" data-p="homes" aria-pressed="false">Tasks &amp; searches</button><button type="button" data-p="info" aria-pressed="false">Details</button></div>'
      +'<div class="cols"><div data-pane="info">'+details+'</div><div data-pane="act" class="show">'+mid+'</div>'+right+'</div>';
    function tl(){
      document.getElementById('tl').innerHTML=l.ev.filter(function(e){return tf==='all'||e[0]===tf;}).map(function(e){
        var k=KIND[e[0]],h=e[2]!=null?home(e[2]):null;
        var what=h?'<div class="what"><a href="#" data-home>'+esc(h.addr)+', '+esc(h.city)+'</a> · '+money(h.price)+'</div>':'';
        var q=e[3]?(e[0]==='inquiry'?'<div class="q">“'+esc(e[3])+'”</div>':'<div class="what">'+esc(e[3])+'</div>'):'';
        return '<li><span class="ic '+e[0]+'" aria-hidden="true">'+k[0]+'</span><div><b>'+k[1]+'</b> <span class="t">'+esc(ago(e[1]))+'</span>'+what+q+'</div></li>';
      }).join('')||'<li><span></span><span class="muted">Nothing of this kind yet.</span></li>';
    }
    function drawTasks(){
      var open=l.tasks.filter(function(k){return !k.done;}).length;
      var rows=l.tasks.map(function(k,i){return {k:k,i:i};}).sort(function(a,b){return (a.k.done-b.k.done)||(b.k.at-a.k.at);});
      document.getElementById('cTasks').innerHTML='<h3>Tasks <span class="n">'+open+' open · '+(l.tasks.length-open)+' done</span></h3>'
        +(rows.length?rows.map(function(r){var k=r.k,left=k.target-k.at;
          var sub=k.done?'Done':(left<0?'<b style="color:var(--red)">Overdue by '+dur(-left)+'</b>':'Due in '+dur(left));
          return '<div class="task'+(k.done?' done':'')+'"><button class="tk" type="button" data-t="'+r.i+'" aria-pressed="'+k.done+'" aria-label="'+(k.done?'Mark not done':'Mark done')+': '+esc(k.t)+'">'+(k.done?'✓':'')+'</button><div><b>'+esc(k.t)+'</b><small>'+sub+(k.auto?' · made automatically':'')+'</small></div></div>';
        }).join(''):'<p class="muted" style="margin:0;font-size:15px">Nothing to do for this lead.</p>')
        +'<div class="addrow"><input id="taskIn" placeholder="Add a task" aria-label="Add a task"><button class="btn navy" type="button" id="taskBtn">Add</button></div>';
      document.getElementById('hdWait').innerHTML=waitChip(l);
    }
    function drawNotes(){
      var rows=l.notes.map(function(n,i){return {n:n,i:i};}).sort(function(a,b){return (b.n.pin-a.n.pin)||(a.n.at-b.n.at);});
      document.getElementById('notesN').textContent=l.notes.length?l.notes.length+'':'';
      document.getElementById('notesBox').innerHTML=rows.map(function(r){return '<div class="nt'+(r.n.pin?' pin':'')+'"><div>'+esc(r.n.t)+'<small>'+(r.n.pin?'📌 Pinned · ':'')+esc(ago(r.n.at))+'</small></div><button class="pinb" type="button" data-pin="'+r.i+'">'+(r.n.pin?'Unpin':'Pin')+'</button></div>';}).join('');
    }
    function drawSearch(){
      document.getElementById('cSearch').innerHTML='<h3>Saved searches <span class="n">'+l.ss.length+'</span></h3>'+(l.ss.length?l.ss.map(function(s,i){
        return '<div class="ss"><div><button class="slink" type="button" data-open="'+i+'">'+esc(s[0])+'</button><small>'+s[2]+' homes match · '+(s[3]?'last alert '+esc(ago(s[3])):'just made')+' · tap to see the homes</small></div><button class="tog" type="button" data-s="'+i+'" aria-pressed="'+(!!s[1])+'">'+(s[1]?'On':'Off')+'</button></div>';
      }).join(''):'<p class="muted" style="margin:0;font-size:15px">No saved searches.</p>')
      +(nsOpen?'<div class="newbox"><b>New search for '+esc(l.first)+'</b><p class="muted" style="margin:4px 0 8px;font-size:14px">Type it the way you\'d say it, or tap a template.</p><input type="text" id="nsIn" placeholder="Detached, Vellore Village, 2,500 to 3,000 sq ft" aria-label="Describe the search">'
        +'<div class="tp">'+TPL.map(function(t,i){return '<button type="button" data-tpl="'+i+'">'+esc(t)+'</button>';}).join('')+'</div>'
        +'<label><input type="checkbox" id="nsTpl"> Save as a template for other leads</label><button class="btn" type="button" id="mkS" style="width:100%">Create search + turn alerts on</button></div>'
        :'<button class="btn ghost" type="button" id="newS" style="width:100%;margin-top:10px">+ New search for this lead</button>');
    }
    tl();drawTasks();drawNotes();drawSearch();
    app.onclick=function(ev){
      var t=ev.target,el,c=function(s){return t.closest?t.closest(s):null;};
      if(c('#back')){location.hash='';return;}
      if(c('[data-home]')){ev.preventDefault();toast('Mockup: opens the listing page on soldmike.com');return;}
      if(c('[data-fub]')){ev.preventDefault();toast('Mockup: opens this person in Follow Up Boss');return;}
      if(c('[data-mail]')){ev.preventDefault();toast('Mockup: opens the email box in Follow Up Boss, so your reply is logged');return;}
      if(c('[data-rv]')){ev.preventDefault();toast('Mockup: opens RealView with this address filled in. You just hit Enter.');return;}
      if((el=c('.tk'))){var k=l.tasks[+el.dataset.t];k.done=!k.done;drawTasks();toast('Mockup: would also '+(k.done?'complete':'reopen')+' this task in Follow Up Boss');return;}
      if(c('#taskBtn')){var ti=document.getElementById('taskIn').value.trim();if(!ti)return;l.tasks.unshift({t:ti,at:0,target:D,done:false,auto:0});drawTasks();toast('Mockup: would also add this task in Follow Up Boss');return;}
      if(c('#noteBtn')){var ni=document.getElementById('noteIn'),nv=ni.value.trim();if(!nv)return;l.notes.unshift({t:nv,at:0,pin:0});l.ev.unshift(['note',0,null,nv]);ni.value='';drawNotes();tl();toast('Mockup: would also add this note in Follow Up Boss');return;}
      if((el=c('[data-pin]'))){var nt=l.notes[+el.dataset.pin];nt.pin=nt.pin?0:1;drawNotes();return;}
      if((el=c('.tog'))){var s=l.ss[+el.dataset.s];s[1]=s[1]?0:1;drawSearch();toast('Mockup: alert '+(s[1]?'on':'off')+' (not saved)');return;}
      if((el=c('[data-open]'))){openSearch(l,+el.dataset.open);return;}
      if(c('#newS')){nsOpen=true;drawSearch();document.getElementById('nsIn').focus();return;}
      if((el=c('[data-tpl]'))){document.getElementById('nsIn').value=TPL[+el.dataset.tpl];return;}
      if(c('#mkS')){var si=document.getElementById('nsIn').value.trim();if(!si)return;var keep=document.getElementById('nsTpl').checked;l.ss.unshift([si,1,5,0]);if(keep&&TPL.indexOf(si)<0)TPL.push(si);nsOpen=false;drawSearch();toast('Mockup: search made, alerts on'+(keep?', saved as a template':'')+'. Also goes to Follow Up Boss.');return;}
      if((el=c('#tfil button'))){tf=el.dataset.k;[].forEach.call(document.querySelectorAll('#tfil button'),function(x){x.setAttribute('aria-pressed',x===el);});tl();return;}
      if((el=c('#ptabs button'))){[].forEach.call(document.querySelectorAll('#ptabs button'),function(x){x.setAttribute('aria-pressed',x===el);});
        [].forEach.call(document.querySelectorAll('.cols [data-pane]'),function(p){p.classList.toggle('show',p.dataset.pane===el.dataset.p);});return;}
    };
  }

  // ---------- two ways in ----------
  // 1) soldmike.com/leads/ : its own sign-in page (this mockup: ?from=site). 2) HQ › Leads tab: already signed in with the HQ PIN, opens straight to the list.
  var SITE=/[?&]from=site/.test(location.search);
  function signedIn(){try{return sessionStorage.getItem('mock_leads_in')==='1';}catch(e){return false;}}
  if(SITE){document.documentElement.classList.add('site');var bl=document.getElementById('barLnk');bl.textContent='Sign out';bl.href='#';
    bl.onclick=function(ev){ev.preventDefault();try{sessionStorage.removeItem('mock_leads_in');}catch(e){}location.hash='#signin';route();};
    var mw=document.getElementById('mockWay');mw.textContent='See the HQ way in';mw.href='/hq/leads/';}
  function signin(){
    app.innerHTML='<form class="signin" id="sf"><h1>Leads sign-in</h1><p class="muted" style="margin:0;font-size:15px">soldmike.com/leads · for Michael (and team members he adds)</p>'
      +'<label>Email<input type="email" autocomplete="username" placeholder="you@example.com" required></label>'
      +'<label>Password<input type="password" autocomplete="current-password" placeholder="••••••••" required></label>'
      +'<label class="keep"><input type="checkbox" checked> Keep me signed in on this phone</label>'
      +'<button class="btn" type="submit">Sign in</button><a href="#" id="fg" style="font-size:15px;text-align:center">Forgot password?</a></form>'
      +'<p class="ways"><b>Two ways in, same dashboard:</b> sign in here on soldmike.com/leads, or tap the <b>Leads</b> tab in HQ (HQ already knows it\'s you, so it opens straight to the list).</p>';
    document.getElementById('sf').onsubmit=function(ev){ev.preventDefault();try{sessionStorage.setItem('mock_leads_in','1');}catch(e){}toast('Mockup: any email and password work');location.hash='';route();};
    document.getElementById('fg').onclick=function(ev){ev.preventDefault();toast('Mockup: would email a reset link');};
  }

  function route(){app.onclick=null;document.body.classList.remove('hasstrip');var bl=document.getElementById('barLnk');if(SITE&&(location.hash==='#signin'||!signedIn())){bl.hidden=true;signin();return;}bl.hidden=false;var m=location.hash.match(/^#lead-(\d+)$/);if(m)person(+m[1]);else list();}
  addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
