<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdsView Leads | SoldMike</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/hq/ads/icon.svg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* AdsView › Leads (soldmike.com/hq/ads/leads/, host PIN). Every lead that came into Follow Up Boss FROM AN AD in the chosen dates
   (Michael, Nov 13: "the whole point of it is from ads"), by campaign, with Meta spend and Meta's own count beside it:
   new people plus existing contacts who signed up or asked again (FUB merges those and shows a Lead Alert).
   Data: /api/hq/ads/newleads (listings Worker). Read only: nothing here changes Follow Up Boss or Meta.
   Phone first, big text (approved Nov 13, 2026: body ~19px, nothing under 14px). Same dark look as the AdsView dashboard. */
:root{
  color-scheme:dark;
  --bg:#131722; --panel:#1a1f2e; --panel2:#20263a; --line:#2c3347; --line2:#3a425a;
  --fg:#eef1f7; --soft:#c3cad9; --muted:#8f99b0;
  --up:#26a69a; --down:#ef5350; --blue:#2962ff; --blue-soft:#7ea2ff; --amber:#f0b24a; --tint:#17213a;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:400 19px/1.5 var(--ui)}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top .in{max-width:820px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand a{color:var(--muted);text-decoration:none;font-size:16px}
.brand b{font-size:21px}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
nav.tabs a{padding:7px 14px;border-radius:7px;font-weight:600;font-size:16px;color:var(--soft);text-decoration:none}
nav.tabs a[aria-current="page"]{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-top:14px}
.chip{font:inherit;font-size:16px;padding:7px 13px;border:1px solid var(--line2);border-radius:999px;color:var(--soft);background:transparent;cursor:pointer}
.chip.on{border-color:var(--blue);color:#fff;background:var(--tint)}
.chip:focus-visible,nav.tabs a:focus-visible,button:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}
.range{font-size:15px;color:var(--muted)}
.range b{color:var(--soft);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi .v{font:600 26px var(--num);font-variant-numeric:tabular-nums}
.kpi .s{font-size:14px;color:var(--soft)}
.kpi.hero .v{color:var(--up)}
.kpi.warn .v{color:var(--amber)}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:23px}}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
section.card h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
section.card h2 small{text-transform:none;letter-spacing:0;font-weight:500;font-size:14px}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:15px;color:var(--soft);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--ui);white-space:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.day{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;padding:12px 0 4px;display:flex;justify-content:space-between}
.lead{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.lead:hover .nm{text-decoration:underline}
.lead .nm{font-weight:600;font-size:19px}
.lead .sub{font-size:15px;color:var(--muted)}
.lead .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;text-align:right}
.lead .tm{font-family:var(--num);font-size:15px;color:var(--soft)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-block;font:600 14px var(--ui);padding:3px 8px;border-radius:5px;white-space:nowrap}
.t-new{background:#3d2a12;color:var(--amber)} .t-con{background:#1d2a4d;color:var(--blue-soft)} .t-apt{background:#123a36;color:#5fd3c5}
.t-paid{background:#123a36;color:#5fd3c5} .t-again{background:#262b3b;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 15px var(--ui);padding:8px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--soft);cursor:pointer}
.check{font-size:16px;padding:10px 12px;border-radius:8px;background:var(--panel2);display:flex;gap:9px}
.check::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px}
.empty{color:var(--muted);font-size:16px;padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:8px;font-size:16px;z-index:20}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:12px;padding:20px}
dialog input{font:inherit;padding:10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);width:100%}
dialog button{font:inherit;margin-top:12px;padding:9px 16px;border-radius:7px;border:0;background:var(--blue);color:#fff}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><a href="/hq/">‹ HQ</a><b>AdsView</b></div>
  <nav class="tabs" aria-label="AdsView"><a href="/hq/ads/">Dashboard</a><a href="/hq/ads/leads/" aria-current="page">Leads</a></nav>
</div></header>

<div class="wrap">
  <div class="chips" id="chips" role="group" aria-label="Dates"></div>
  <div class="range" id="rangeTxt">Loading…</div>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <h2><span id="chTitle">New leads per day</span><small id="chSub"></small></h2>
    <div class="legend" id="legend"></div>
    <svg id="chart" viewBox="0 0 360 210" role="img" aria-label="New leads by source"></svg>
  </section>

  <section class="card">
    <h2>By campaign <small id="srcSub"></small></h2>
    <div class="tbl"><table><thead><tr><th>Campaign</th><th>Leads</th><th>Meta</th><th>Spent</th><th>Per lead</th></tr></thead><tbody id="srcRows"></tbody></table></div>
  </section>

  <section class="card" id="checkCard" hidden>
    <h2>Did every ad lead reach Follow Up Boss? <small>Meta's count vs FUB</small></h2>
    <div id="checks"></div>
  </section>

  <section class="card">
    <h2><span>Every ad lead</span><small>newest first · tap a name to open it in Follow Up Boss</small></h2>
    <div class="row"><button type="button" class="btn" id="copyBtn">Copy names</button><button type="button" class="btn" id="filtBtn" aria-pressed="false">Only not contacted</button></div>
    <div id="list"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<dialog id="pinDlg"><form method="dialog" id="pinForm"><h2 style="margin:0 0 10px">Host only</h2><input id="pinIn" inputmode="numeric" type="password" autocomplete="off" aria-label="PIN" placeholder="PIN"><p id="pinErr" hidden style="color:var(--down)">Wrong PIN</p><button type="submit">Continue</button></form></dialog>

<script>
(function () {
  'use strict';
  var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://soldmike-listings.broker-e2c.workers.dev';
  var FUBAPP = 'https://app.followupboss.com';
  var $ = function (s) { return document.querySelector(s); };
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function api(path) {
    return fetch(API + '/api/hq/' + path, { headers: { 'X-OH-Pin': store('sm_oh_pin') || '' } }).then(function (r) {
      if (r.status === 401) throw 'pin';
      return r.json().then(function (j) { if (!r.ok || j.error) throw (j.error || r.status); return j; });
    });
  }
  function askPin() { return new Promise(function (res) { var d = $('#pinDlg'); $('#pinForm').onsubmit = function (e) { e.preventDefault(); store('sm_oh_pin', $('#pinIn').value.trim()); d.close(); res(); }; if (!d.open) d.showModal(); $('#pinIn').focus(); }); }
  var toastT; function toast(s) { var t = $('#toast'); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ----- Toronto days -----
  var TZ = 'America/Toronto';
  function tzParts(d) { var o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d).forEach(function (p) { o[p.type] = p.value; }); return o; }
  function dayKey(d) { var p = tzParts(d); return p.year + '-' + p.month + '-' + p.day; }
  // midnight in Toronto for a calendar day (y, m 0-based, d), as a Date
  function tzMidnight(y, m, d) { var g = Date.UTC(y, m, d, 5); for (var i = 0; i < 2; i++) { var p = tzParts(new Date(g)); var shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute); g += Date.UTC(y, m, d) - shown; } return new Date(g); }
  function today() { var p = tzParts(new Date()); return { y: +p.year, m: +p.month - 1, d: +p.day }; }
  function addD(t, n) { var x = new Date(Date.UTC(t.y, t.m, t.d + n)); return { y: x.getUTCFullYear(), m: x.getUTCMonth(), d: x.getUTCDate() }; }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function lab(t) { return MON[t.m] + ' ' + t.d; }
  function labY(t) { return MON[t.m] + ' ' + t.d + ', ' + t.y; }
  function key(t) { return t.y + '-' + String(t.m + 1).padStart(2, '0') + '-' + String(t.d).padStart(2, '0'); }

  var RANGES = [['today', 'Today'], ['yday', 'Yesterday'], ['3d', '3 days'], ['7d', '7 days'], ['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year']];
  function rangeOf(r) {
    var t = today(), tm = addD(t, 1), q0 = Math.floor(t.m / 3) * 3;
    var R = {
      today: { a: t, b: tm, label: 'Today, ' + labY(t) + ' (so far)', unit: 'day', pa: addD(t, -1), pb: t, pl: 'yesterday' },
      yday: { a: addD(t, -1), b: t, label: 'Yesterday, ' + labY(addD(t, -1)), unit: 'day', pa: addD(t, -2), pb: addD(t, -1), pl: 'the day before' },
      '3d': { a: addD(t, -2), b: tm, label: lab(addD(t, -2)) + ' – ' + labY(t) + ' (today included)', unit: 'day', pa: addD(t, -5), pb: addD(t, -2), pl: 'the 3 days before' },
      '7d': { a: addD(t, -6), b: tm, label: lab(addD(t, -6)) + ' – ' + labY(t) + ' (today included)', unit: 'day', pa: addD(t, -13), pb: addD(t, -6), pl: 'the 7 days before' },
      month: { a: { y: t.y, m: t.m, d: 1 }, b: tm, label: MON[t.m] + ' 1 – ' + t.d + ', ' + t.y + ' (month so far)', unit: 'day' },
      quarter: { a: { y: t.y, m: q0, d: 1 }, b: tm, label: MON[q0] + ' 1 – ' + labY(t) + ' (quarter so far)', unit: 'week' },
      year: { a: addD({ y: t.y - 1, m: t.m, d: t.d }, 1), b: tm, label: 'Last 12 months, to ' + labY(t), unit: 'month' }
    }[r];
    if (r === 'month') { var pm = new Date(Date.UTC(t.y, t.m - 1, 1)); R.pa = { y: pm.getUTCFullYear(), m: pm.getUTCMonth(), d: 1 }; R.pb = addD(R.pa, t.d); R.pl = MON[R.pa.m] + ' 1 – ' + t.d; }
    if (r === 'quarter') { var pq = new Date(Date.UTC(t.y, q0 - 3, 1)); R.pa = { y: pq.getUTCFullYear(), m: pq.getUTCMonth(), d: 1 }; var days = Math.round((Date.UTC(t.y, t.m, t.d) - Date.UTC(t.y, q0, 1)) / 864e5) + 1; R.pb = addD(R.pa, days); R.pl = 'the same days last quarter'; }
    if (r === 'year') { R.pa = { y: t.y - 2, m: t.m, d: t.d }; R.pa = addD(R.pa, 1); R.pb = R.a; R.pl = 'the 12 months before'; }
    return R;
  }

  // ----- groups = ad campaigns (built each load from Meta's campaigns and the leads' campaigns) -----
  var PAL = ['--up', '--blue-soft', '--amber', '--down', '#b48cf2', '#f28cc4', '--soft'];
  var GROUPS = [];
  function shortCamp(c) { var p = String(c || '').split(' - '); if (/^op team$/i.test(p[0]) && p.length > 1) p.shift(); return (p[0] || 'Ad') + (/facebook form/i.test(c) ? ' · Facebook form' : /website/i.test(c) ? ' · website' : ''); }
  function groupOf(l) { return l.campaign || '?'; }
  function colOf(c) { return c.charAt(0) === '#' ? c : col(c); }
  var RANGE = store('adsview_leads_range') || '7d', DATA = null, PREV = null, D14 = null, ONLYNEW = false, CSS = getComputedStyle(document.documentElement);
  function col(v) { return CSS.getPropertyValue(v).trim(); }

  function load() {
    var R = rangeOf(RANGE);
    $('#rangeTxt').innerHTML = 'Showing <b>' + esc(R.label) + '</b> · loading…';
    var q = function (a, b) { return 'ads/newleads?from=' + encodeURIComponent(tzMidnight(a.y, a.m, a.d).toISOString()) + '&to=' + encodeURIComponent(tzMidnight(b.y, b.m, b.d).toISOString()); };
    var short = RANGE === 'today' || RANGE === 'yday';
    Promise.all([api(q(R.a, R.b)), R.pa ? api(q(R.pa, R.pb)).catch(function () { return null; }) : null,
      short ? api(q(addD(R.b, -14), R.b)).catch(function () { return null; }) : null]).then(function (r) {
      DATA = r[0]; PREV = r[1]; D14 = r[2]; FUBAPP = DATA.fubApp || FUBAPP; render();
    }).catch(function (e) { if (e === 'pin') return askPin().then(load); $('#rangeTxt').textContent = 'Could not load the leads. Check the connection and try again.'; });
  }

  function render() {
    var R = rangeOf(RANGE);
    // only leads that came in from an ad: a labelled landing-page link (tag Meta Ad) or a Facebook lead form
    var prep = function (list) { return list.filter(function (l) { return l.paid; }).map(function (l) { l.g = groupOf(l); l.day = dayKey(new Date(l.at)); return l; }); };
    var L = prep(DATA.leads);
    $('#rangeTxt').innerHTML = 'Showing <b>' + esc(R.label) + '</b>' + (PREV ? ' · compared with ' + esc(R.pl) : '') + ' · leads from Follow Up Boss, spend from Meta';
    var ka = key(R.a), kb = key(addD(R.b, -1)), spend = 0, metaLeads = 0, CS = {};
    (DATA.campDays || []).forEach(function (d) { if (d[0] >= ka && d[0] <= kb) { var c = CS[d[1]] = CS[d[1]] || { spend: 0, meta: 0 }; c.spend += d[2]; c.meta += d[3]; spend += d[2]; metaLeads += d[3]; } });
    // campaigns shown: any that spent in these days or brought a lead, biggest spend first
    var names = Object.keys(CS).filter(function (c) { return CS[c].spend > 0 || CS[c].meta > 0; });
    L.forEach(function (l) { if (l.g !== '?' && names.indexOf(l.g) < 0) names.push(l.g); });
    names.sort(function (x, y) { return ((CS[y] || {}).spend || 0) - ((CS[x] || {}).spend || 0); });
    GROUPS = names.map(function (c, i) { return { k: c, n: shortCamp(c), c: PAL[i % PAL.length] }; });
    if (L.some(function (l) { return l.g === '?'; })) GROUPS.push({ k: '?', n: 'Ad, campaign not known', c: '--muted' });
    var n = L.length, again = L.filter(function (l) { return l.again; }).length, notYet = L.filter(function (l) { return l.status === 'new'; }).length;
    var pn = PREV ? prep(PREV.leads).length : null, delta = pn ? Math.round((n - pn) / pn * 100) : null;
    var K = [
      ['Leads from ads', n, pn == null ? '' : pn === 0 ? 'none ' + R.pl : (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '% vs ' + R.pl, 'hero'],
      ['Spent on ads', '$' + spend.toFixed(2), '$' + (spend * 1.13).toFixed(2) + ' with tax'],
      ['Cost per lead', n ? '$' + (spend / n).toFixed(2) : '–', n ? 'spent ÷ ad leads in FUB' : 'no ad leads yet'],
      ['Not contacted yet', notYet, notYet ? 'call these first' : 'all reached', notYet ? 'warn' : ''],
      ['Signed up again', again, 'already in FUB before'],
      ["Meta's count", metaLeads, metaLeads === n ? 'matches FUB' : metaLeads > n ? (metaLeads - n) + ' more than FUB' : (n - metaLeads) + ' fewer than FUB', metaLeads > n ? 'warn' : '']
    ];
    $('#kpis').innerHTML = K.map(function (k) { return '<div class="kpi ' + (k[3] || '') + '"><span class="l">' + k[0] + '</span><span class="v">' + k[1] + '</span><span class="s">' + esc(k[2]) + '</span></div>'; }).join('');

    // chart buckets
    var B = [], i;
    if (R.unit === 'day') {
      var a = RANGE === 'today' || RANGE === 'yday' ? addD(R.b, -14) : R.a;
      for (var t = a; key(t) < key(R.b); t = addD(t, 1)) B.push({ lab: String(t.d), k0: key(t), k1: key(t), hi: (RANGE === 'today' || RANGE === 'yday') && key(t) === ka });
    } else if (R.unit === 'week') {
      for (var w = R.a; key(w) < key(R.b); w = addD(w, 7)) { var e = addD(w, 6); if (key(e) >= key(R.b)) e = addD(R.b, -1); B.push({ lab: lab(w), k0: key(w), k1: key(e) }); }
    } else {
      for (i = 0; i < 13; i++) { var s0 = new Date(Date.UTC(R.a.y, R.a.m + i, 1)), s = { y: s0.getUTCFullYear(), m: s0.getUTCMonth(), d: 1 }, e0 = new Date(Date.UTC(s.y, s.m + 1, 0)), e1 = { y: e0.getUTCFullYear(), m: e0.getUTCMonth(), d: e0.getUTCDate() };
        if (key(s) >= key(R.b)) break; B.push({ lab: MON[s.m], k0: key(s) < ka ? ka : key(s), k1: key(e1) }); }
    }
    // Today / Yesterday: the chart shows the last 14 days (fetched separately) so the day can be read against normal
    var pool = D14 ? prep(D14.leads) : L;
    pool.forEach(function (l) { if (!GROUPS.some(function (g) { return g.k === l.g; })) GROUPS.push({ k: l.g, n: l.g === '?' ? 'Ad, campaign not known' : shortCamp(l.g), c: l.g === '?' ? '--muted' : PAL[GROUPS.length % PAL.length] }); });
    B.forEach(function (b) { b.v = {}; b.t = 0; pool.forEach(function (l) { if (l.day >= b.k0 && l.day <= b.k1) { b.v[l.g] = (b.v[l.g] || 0) + 1; b.t++; } }); });
    $('#chTitle').textContent = 'Ad leads per ' + R.unit;
    $('#chSub').textContent = RANGE === 'today' || RANGE === 'yday' ? 'last 2 weeks, ' + (RANGE === 'today' ? 'today' : 'yesterday') + ' outlined' : R.unit === 'week' ? 'last bar = this week so far' : R.unit === 'month' ? 'last bar = this month so far' : '';
    $('#legend').innerHTML = GROUPS.map(function (g) { return '<span style="--c:' + (g.c.charAt(0) === '#' ? g.c : 'var(' + g.c + ')') + '">' + esc(g.n) + '</span>'; }).join('');
    drawChart(B);

    // by campaign: FUB leads, Meta's count, spend, cost per lead
    $('#srcSub').textContent = R.label.split(' (')[0];
    $('#srcRows').innerHTML = GROUPS.filter(function (g) { return CS[g.k] || L.some(function (l) { return l.g === g.k; }); }).map(function (g) {
      var m = L.filter(function (l) { return l.g === g.k; }).length, c = CS[g.k] || { spend: 0, meta: 0 };
      return '<tr><td><span class="dot" style="background:' + colOf(g.c) + '"></span>' + esc(g.n) + '</td><td>' + m + '</td><td>' + (g.k === '?' ? '–' : c.meta) + '</td><td>' + (g.k === '?' ? '–' : '$' + c.spend.toFixed(2)) + '</td><td>' + (m && c.spend ? '$' + (c.spend / m).toFixed(2) : '–') + '</td></tr>';
    }).join('') + '<tr><td><b>All ads</b></td><td><b>' + n + '</b></td><td><b>' + metaLeads + '</b></td><td><b>$' + spend.toFixed(2) + '</b></td><td><b>' + (n ? '$' + (spend / n).toFixed(2) : '–') + '</b></td></tr>';

    // Meta vs FUB check, per campaign
    var cks = [];
    GROUPS.forEach(function (g) { if (g.k === '?') return; var m = L.filter(function (l) { return l.g === g.k; }).length, c = CS[g.k]; if (!c) return;
      if (c.meta > m) cks.push(['--amber', g.n + ': Meta counted ' + c.meta + ', Follow Up Boss has ' + m + '. ' + (c.meta - m) + ' to look for (a lead that never reached FUB, or one whose ad label was lost).']); });
    var unk = L.filter(function (l) { return l.g === '?'; }).length;
    if (unk) cks.push(['--blue-soft', unk + ' ad lead' + (unk > 1 ? 's' : '') + ' with no campaign name: they came from an ad, but the link carried no campaign label.']);
    if (!cks.length && (metaLeads || n)) cks.push(['--up', 'Every ad lead Meta counted is in Follow Up Boss.']);
    $('#checkCard').hidden = !cks.length;
    $('#checks').innerHTML = cks.map(function (c) { return '<div class="check" style="--c:var(' + c[0] + ')"><span>' + esc(c[1]) + '</span></div>'; }).join('');
    renderList(L);
  }

  function drawChart(B) {
    var s = $('#chart'), NS = 'http://www.w3.org/2000/svg';
    function el(n, a, t) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; }
    s.innerHTML = '';
    var L0 = 30, R0 = 352, T = 16, Bt = 176, mx = Math.max(4, Math.max.apply(null, B.map(function (b) { return b.t; }).concat([0]))), step = mx > 40 ? 20 : mx > 16 ? 10 : mx > 8 ? 4 : 2, top = Math.ceil(mx / step) * step;
    var y = function (v) { return Bt - (Bt - T) * v / top; }, bw = (R0 - L0) / Math.max(1, B.length);
    for (var v = 0; v <= top; v += step) { s.append(el('line', { x1: L0, x2: R0, y1: y(v), y2: y(v), stroke: col('--line') })); s.append(el('text', { x: L0 - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 13, fill: col('--muted'), 'font-family': 'JetBrains Mono' }, v)); }
    var longLab = B.length && B[0].lab.length > 3, every = Math.max(1, Math.ceil(B.length / (longLab ? 5 : 9)));
    B.forEach(function (b, i) {
      var x = L0 + i * bw + bw * .14, w = bw * .72, acc = 0;
      GROUPS.forEach(function (g) { var c = b.v[g.k] || 0; if (!c) return; s.append(el('rect', { x: x, y: y(acc + c), width: w, height: y(acc) - y(acc + c), fill: colOf(g.c) })); acc += c; });
      if (b.hi) s.append(el('rect', { x: x - 2, y: y(Math.max(acc, 0)) - 2, width: w + 4, height: Bt - y(acc) + 2, fill: 'none', stroke: col('--fg'), 'stroke-width': 2 }));
      if (acc && B.length <= 16) s.append(el('text', { x: x + w / 2, y: y(acc) - 5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: col('--fg'), 'font-family': 'JetBrains Mono' }, acc));
      if (i % every === 0) s.append(el('text', { x: x + w / 2, y: Bt + 20, 'text-anchor': 'middle', 'font-size': 13, fill: col('--muted'), 'font-family': 'JetBrains Mono' }, b.lab));
    });
  }

  function when(l) { var d = new Date(l.at); return d.toLocaleTimeString('en-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }); }
  function renderList(L) {
    var M = ONLYNEW ? L.filter(function (l) { return l.status === 'new'; }) : L, html = '', cur = '', t = today();
    var tk = key(t), yk = key(addD(t, -1));
    if (!M.length) { $('#list').innerHTML = '<p class="empty">' + (ONLYNEW ? 'Everyone in these dates has been contacted.' : 'No leads came in from ads on these dates.') + '</p>'; return; }
    var counts = {}; M.forEach(function (l) { counts[l.day] = (counts[l.day] || 0) + 1; });
    M.forEach(function (l) {
      if (l.day !== cur) {
        cur = l.day; var p = l.day.split('-'), dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
        var nm = l.day === tk ? 'Today' : l.day === yk ? 'Yesterday' : WD[dt.getUTCDay()];
        html += '<div class="day"><span>' + nm + ' · ' + MON[+p[1] - 1] + ' ' + (+p[2]) + '</span><span>' + counts[l.day] + (counts[l.day] === 1 ? ' lead' : ' leads') + '</span></div>';
      }
      var from = l.campaign ? shortCamp(l.campaign) : 'Ad · ' + l.source;
      var st = { new: ['t-new', 'Not contacted'], con: ['t-con', 'Contacted'], apt: ['t-apt', 'Appointment'] }[l.status];
      html += '<a class="lead" href="' + FUBAPP + '/2/people/view/' + l.id + '" target="_blank" rel="noopener"><span><span class="nm">' + esc(l.name) + '</span><br><span class="sub">' + esc(from) + '</span>'
        + '<span class="tags">' + (l.again ? '<span class="tag t-again">Signed up again</span>' : '') + '</span></span>'
        + '<span class="rt"><span class="tm">' + when(l) + '</span><span class="tag ' + st[0] + '">' + st[1] + '</span></span></a>';
    });
    $('#list').innerHTML = html;
  }

  $('#copyBtn').onclick = function () {
    if (!DATA) return;
    var R = rangeOf(RANGE), AL = DATA.leads.filter(function (l) { return l.paid; }), lines = ['Leads from ads, ' + R.label + ' (' + AL.length + ')'];
    AL.forEach(function (l) { lines.push(l.day + ' ' + when(l) + ' · ' + l.name + ' · ' + (l.campaign ? shortCamp(l.campaign) : 'ad') + (l.again ? ' · signed up again' : '')); });
    var txt = lines.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('Copied ' + AL.length + ' names'); }).catch(function () { toast('Could not copy'); });
  };
  $('#filtBtn').onclick = function () { ONLYNEW = !ONLYNEW; this.setAttribute('aria-pressed', ONLYNEW); this.classList.toggle('chip', false); this.style.borderColor = ONLYNEW ? col('--blue') : ''; this.style.color = ONLYNEW ? '#fff' : ''; if (DATA) renderList(DATA.leads.filter(function (l) { return l.paid; })); };

  $('#chips').innerHTML = RANGES.map(function (r) { return '<button type="button" class="chip' + (r[0] === RANGE ? ' on' : '') + '" data-r="' + r[0] + '">' + r[1] + '</button>'; }).join('');
  $('#chips').onclick = function (e) { var b = e.target.closest('.chip'); if (!b) return; RANGE = b.dataset.r; store('adsview_leads_range', RANGE); [].forEach.call(document.querySelectorAll('#chips .chip'), function (x) { x.classList.toggle('on', x === b); }); load(); };
  load();
})();
</script>
</body>
